# interview_rubrics/default.yaml — Phase 6 5-field interview rubric.
#
# Consumed by `lib/interview_engine.py:score_interview_ambiguity` (the
# local heuristic path) and by `eval/prompts/judge-interview-ambiguity.md`
# (the LLM-judge path). Both MUST read the same field list + thresholds
# so a re-score against the LLM judge never disagrees with the
# deterministic scores the user just saw.
#
# Field list order is the canonical MUST-15 plan pattern. Do not
# reorder without updating `FIVE_FIELDS` in `interview_engine.py`.

schema_version: "1.0.0"

# The 5 mandated fields. Each has a one-line human definition + a
# "clear" cue the judge uses to score 0-10 (lower = clearer).
fields:
  - key: goal
    label: "Goal"
    description: "One sentence: what we ship and what changes for the user."
    clear_cue: "Single outcome stated in concrete user-facing terms."
    ambiguous_cue: "Vague, multi-clause, or open-ended phrasing."

  - key: constraints
    label: "Constraints"
    description: "Explicit guardrails / non-negotiables."
    clear_cue: "Each constraint is a named, verifiable rule."
    ambiguous_cue: "Soft language (probably, maybe, ideally, etc.)."

  - key: success_criteria
    label: "Success criteria"
    description: "Measurable pass conditions for the shipped artifact."
    clear_cue: "Numeric or boolean thresholds an SRE could run on."
    ambiguous_cue: "Subjective adjectives (good, fast, easy) without numbers."

  - key: anti_goals
    label: "Anti-goals"
    description: "What we will NOT do (negative spec)."
    clear_cue: "Each anti-goal names a feature/audience we are explicitly excluding."
    ambiguous_cue: "Generic platitudes (no scope creep) without a concrete target."

  - key: acceptance_rubric
    label: "Acceptance rubric"
    description: "How a reviewer scores 'done'."
    clear_cue: "Rubric names the reviewer, the checklist, and the pass threshold."
    ambiguous_cue: "One-line 'looks good' criteria without a checklist."

# Per-field thresholds used by the LLM judge (0-10 axis).
# Score <= clear_threshold -> field passes. Score >= ambiguous_threshold
# -> field flagged as ambiguous and re-asked.
scoring:
  clear_threshold: 4       # <= 4 = clear (passes validation)
  ambiguous_threshold: 7   # >= 7 = ambiguous (re-ask)
  missing_field_score: 10  # absent field = worst case

# Convergence rules. Matched 1:1 by `interview_engine.py` constants.
convergence:
  safety_valve: 8           # hard cycle cap (issue #381)
  dedup_metric_cycles: 2   # identical-ambiguity-cycle=2 breaks the loop
  min_clear_fields_for_ok: 5  # all 5 must pass before status=ok
  min_clear_fields_for_best_effort: 3

# Allowed terminal statuses (deterministic set; the LLM judge never
# invents new ones). Mirrors `interview_engine.STATUSES`.
statuses:
  - ok
  - held
  - best-effort
  - user-acknowledged
  - rejected
