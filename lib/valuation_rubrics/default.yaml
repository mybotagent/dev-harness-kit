# lib/valuation_rubrics/default.yaml — Phase 4 (issue #370)
#
# SSOT for the 6-dimension plan-value rubric. /dev-kit:valuate calls the
# LLM judge with `eval/prompts/judge-plan-value.md`, which scores each
# axis 0-5 according to the rules below. The numeric scores feed
# `lib/valuation_engine.py:decide()` to produce the 4-way verdict
# (proceed / revise / hold / kill) that the build gate reads.
#
# Score scale (matches SCORE_MIN / SCORE_MAX in valuation_engine.py):
#   0 — not scored (model refused to judge; treated as failure by judge harness)
#   1 — fatal: this dimension kills the plan outright (risk_floor)
#   2 — weak: real concerns; not yet at risk-floor but close
#   3 — adequate: passes dimension_floor but not proceed-worthy
#   4 — strong: meets proceed_threshold on its own
#   5 — exceptional: clear positive signal, no caveats
#
# Threshold defaults (mirrored in valuation_engine.py constants):
#   proceed_threshold: 4.0  (weighted average >= 4.0 AND every dimension >= 3.0)
#   hold_threshold:    3.0  (weighted average < 3.0  -> kill by priority)
#   dimension_floor:   3.0  (any one dimension < 3.0 -> revise)
#   risk_floor:        2.0  (any one dimension < 2.0 -> kill absolute)
#
# The absolute risk-floor rule (last axis below) is the no-go gate's
# load-bearing invariant: even a perfect 5.0 on every other dimension
# cannot rescue a 1.5 on `risk_vs_reward`. The build stage refuses to
# override this regardless of user pressure.

version: "1.0.0"

dimensions:
  - id: problem_fit
    title: "User problem fit"
    description: |
      Does this plan solve a problem the target user actually has today?
      Penalize solutions in search of a problem, "nice-to-haves", and
      features that the user has not asked for.
    scoring:
      "1": "no evidence the user has this problem (speculation / vanity)"
      "2": "weak signals; user pain unclear or rare"
      "3": "user has the problem but current workaround is acceptable"
      "4": "user has the problem and the plan removes a clear obstacle"
      "5": "user is actively asking for this exact solution today"

  - id: roi_estimate
    title: "ROI estimate"
    description: |
      Does the value (LTV * reachable users) plausibly justify the cost
      (eng-hours * rate + infra + GTM)? Use the same value_score formula
      as /dev-kit:plan (Gate 2/5): LTV * users / cost >= 3.0 is healthy.
    scoring:
      "1": "value_score < 1.0; cost dwarfs any plausible return"
      "2": "value_score 1.0–2.0; marginal ROI"
      "3": "value_score 2.0–3.0; borderline"
      "4": "value_score 3.0–5.0; healthy ROI"
      "5": "value_score > 5.0; clearly worth building"

  - id: existing_solution_edge
    title: "Edge over existing solutions"
    description: |
      Is this plan materially better than what the user can already use
      (off-the-shelf tools, prior art, an in-house workaround)? Penalize
      "yet another X" with no clear differentiator.
    scoring:
      "1": "free / paid alternatives solve this better"
      "2": "marginal improvement over existing options"
      "3": "comparable to alternatives but with one real edge"
      "4": "clearly better than the leading alternative for most users"
      "5": "no viable alternative; the plan creates a new category"

  - id: team_capability
    title: "Team capability match"
    description: |
      Can the team that will build and operate this actually deliver it?
      Stack familiarity, on-call burden, and skill gaps all count.
    scoring:
      "1": "team lacks core skills; success requires hiring"
      "2": "major skill gaps; expect >50% slip"
      "3": "team can ship a v1 with coaching / pair work"
      "4": "team can ship a v1 within budget on familiar stack"
      "5": "team has shipped similar systems; low execution risk"

  - id: risk_vs_reward
    title: "Risk vs. reward"
    description: |
      If this plan fails in production, how bad is the downside relative
      to the upside of success? Security, data-loss, reputation, blast
      radius, regulatory exposure. This axis is the absolute risk-floor
      check: any score < 2.0 forces a kill regardless of other axes.
    scoring:
      "1": "catastrophic downside; abort (data loss / regulatory / safety)"
      "2": "serious downside; only justifiable if upside is exceptional"
      "3": "moderate downside; manageable with guardrails"
      "4": "limited downside; recoverable failure modes"
      "5": "low downside; failure is contained and reversible"

  - id: measurability
    title: "Measurability"
    description: |
      Will the team know within 2 weeks of launch whether this is
      working? Penalize plans whose success signal is vague ("we'll see
      how it feels") or unobservable.
    scoring:
      "1": "no success metric; ship and pray"
      "2": "metric defined but data not collectable"
      "3": "metric defined and collectable; signal is noisy"
      "4": "single leading metric; clean signal within 2 weeks"
      "5": "leading + lagging metrics; A/B-able within 2 weeks"

thresholds:
  proceed_threshold: 4.0   # weighted average for "proceed"
  hold_threshold: 3.0      # weighted average below this -> kill
  dimension_floor: 3.0     # any axis < this -> revise (unless risk-floor)
  risk_floor: 2.0          # any axis < this -> kill (absolute)

verdicts:
  proceed: "build proceeds; no gate blocks"
  revise:  "plan stage must regenerate; gate refuses build"
  hold:    "build refused; re-evaluate after delay"
  kill:    "plan archived as no-go; build refused"
