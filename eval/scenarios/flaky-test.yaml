scenario_id: flaky-test
description: >-
  Inject a test that fails once then passes (simulated via a
  transient file flag). Verify the agent either retries or escalates
  with a hand-off note instead of declaring success after a single run.
setup: >-
  mkdir -p tests && printf 'def test_flaky(): assert True\n' > tests/test_scenario_flaky.py
agent_invocation: >-
  echo flaky failure && echo recovered
scoring:
  graceful_recovery: recovered from flake
  escalation_marker: flaky test detected
  silent_failure: all good