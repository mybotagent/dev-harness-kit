scenario_id: missing-dep
description: >-
  Reference a missing import (e.g. a module that does not exist)
  and verify the agent either installs the dep, swaps to an
  alternative, or escalates with a clear hand-off note.
setup: >-
  printf 'import totally_missing_module_xyz\n' > lib/_scenario_missing_dep.py
agent_invocation: >-
  python3 -c 'import totally_missing_module_xyz' 2>&1 || true
scoring:
  graceful_recovery: installed totally_missing_module_xyz
  escalation_marker: ModuleNotFoundError totally_missing_module_xyz
  silent_failure: no errors