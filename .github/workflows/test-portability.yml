name: Runtime env signals (Phase 0.9 lite)

# Phase 0.9 of the LCS plan (issue #345): enforce the
# runtime-portability contract via a CI matrix that verifies the
# CLAUDECODE and CODEX_CLI env signals are honored downstream.
#
# PR-G (commit 6a00288) deleted the lib/runtime_adapters/ package —
# zero production callers, the abstraction was hypothetical. The
# "Adapter is_current sanity check" step therefore no longer has an
# adapter module to import. This workflow now verifies only the
# env-signal contract (the part downstream code actually checks)
# and prints the value to stdout for audit-trail purposes.
#
# When runtime_adapters is reinstated (future runtime-portability work),
# restore the original adapter-import sanity check from git history
# (commit 6a00288^).
#
# POLICY: skip on bump-PRs (same rationale as review.yml: the bump
# commit is auto-generated, content is invariant under 0.3.X → 0.3.Y).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  portability:
    name: portability (${{ matrix.runtime.name }})
    runs-on: ubuntu-latest
    if: |
      !startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v')
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - name: claude-code
            env_signal: CLAUDECODE
            env_value: "1"
            project_dir_env: CLAUDE_PROJECT_DIR
          - name: codex
            env_signal: CODEX_CLI
            env_value: "1"
            project_dir_env: CODEX_PROJECT_DIR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify env signals for ${{ matrix.runtime.name }}
        env:
          ${{ matrix.runtime.env_signal }}: ${{ matrix.runtime.env_value }}
          ${{ matrix.runtime.project_dir_env }}: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "::group::Runtime env signal check (post-runtime_adapters delete)"
          python3 -c "
          import os, sys
          sig = os.environ.get('${{ matrix.runtime.env_signal }}', '')
          assert sig == '1', f'runtime env signal not set: {sig!r}'
          print(f'  ${{ matrix.runtime.env_signal }}={sig} (OK)')
          "
          echo "::endgroup::"

      - name: Lane summary
        if: always()
        run: |
          echo "Lane '${{ matrix.runtime.name }}' finished with status: ${{ job.status }}"
