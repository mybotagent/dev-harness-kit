name: Runtime Portability (Phase 0.9)

# Phase 0.9 of the LCS plan (issue #345): enforce the
# runtime-portability contract via a CI matrix that runs the same
# `tests/test_portability.py` suite under both runtimes' env signals.
#
# Acceptance from #345: "CI green on both lanes; doc has clear API
# classification."
#
# Why a matrix (not one lane): the runtime-portability guarantee is that
# `ClaudeCodeAdapter` and `CodexAdapter` produce *identical* normalized
# output for the same input (TokenLog / SessionEvent / hook event
# names). A single-lane CI cannot detect a regression that breaks one
# runtime but not the other; the matrix pins both.
#
# Why mockable env signals (not real binaries): `is_current()` requires
# BOTH an env signal AND the runtime binary on PATH. The portable
# contract — the part Phase 1+ code depends on — does NOT need the
# binary; only `is_current()` does. So the matrix sets the env signal
# (which is what every downstream code path actually checks) and lets
# the `is_current()` test self-skip when the binary is absent.
#
# POLICY: skip on bump-PRs (same rationale as review.yml: the bump
# commit is auto-generated, content is invariant under 0.3.X → 0.3.Y).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  portability:
    name: portability (${{ matrix.runtime.name }})
    runs-on: ubuntu-latest
    if: |
      !startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v')
    strategy:
      fail-fast: false
      matrix:
        runtime:
          # Lane 1 — Claude Code env signals.
          # CLAUDECODE=1 is the canonical "I'm running inside Claude Code"
          # signal; CLAUDE_PROJECT_DIR lets tests pin workspace_root().
          - name: claude-code
            env_signal: CLAUDECODE
            env_value: "1"
            project_dir_env: CLAUDE_PROJECT_DIR
          # Lane 2 — Codex env signals.
          # CODEX_CLI=1 is the canonical "I'm running inside Codex" signal.
          - name: codex
            env_signal: CODEX_CLI
            env_value: "1"
            project_dir_env: CODEX_PROJECT_DIR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest + PyYAML
        run: pip install --quiet pytest pyyaml

      - name: Run portability suite under ${{ matrix.runtime.name }} env
        env:
          PYTHONPATH: ${{ github.workspace }}/lib
          # Set the lane-specific env signal so the adapter's is_current()
          # branch is exercised end-to-end (the binary probe still self-
          # skips when the binary is absent — see test_is_current_per_runtime).
          ${{ matrix.runtime.env_signal }}: ${{ matrix.runtime.env_value }}
          ${{ matrix.runtime.project_dir_env }}: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "::group::Adapter is_current sanity check"
          python3 -c "
          import sys
          sys.path.insert(0, 'lib')
          from runtime_adapters.claude_code import ClaudeCodeAdapter
          from runtime_adapters.codex import CodexAdapter
          for name, adapter in (('claude-code', ClaudeCodeAdapter()),
                                ('codex', CodexAdapter())):
              print(f'  {name}.is_current()={adapter.is_current()}')
          "
          echo "::endgroup::"
          echo
          python3 -m pytest tests/test_portability.py -v --tb=short \
            --deselect tests/test_portability.py::TestIsCurrentPerRuntime::test_neither_adapter_matches_in_clean_env

      - name: Lane summary
        if: always()
        run: |
          echo "Lane '${{ matrix.runtime.name }}' finished with status: ${{ job.status }}"
