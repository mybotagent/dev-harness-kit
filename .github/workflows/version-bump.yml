name: version-bump

# Auto-bump PATCH in .claude-plugin/plugin.json on every push to main that
# touches skills/**. Creates the dev-kit--vX.Y.Z git tag the marketplace
# ships with, so /plugin marketplace update -> /reload-plugins detects the
# diff and re-fetches (CLI uses plugin.json:version as cache key; see
# docs/plugins-reference#version-management).
#
# The paths::filter avoids a loop: this commit only touches plugin.json, so
# the next push won't re-match paths: ['skills/**'].

on:
  push:
    branches: [main]
    paths: ['skills/**']

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump PATCH in plugin.json
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "plugin.json:version=$VERSION is not MAJOR.MINOR.PATCH; aborting"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          jq --arg v "$NEW_VERSION" '.version = $v' .claude-plugin/plugin.json \
            > .claude-plugin/plugin.json.tmp
          mv .claude-plugin/plugin.json.tmp .claude-plugin/plugin.json
          echo "version=$NEW_VERSION"

      - name: Commit bump and tag
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "chore(release): bump dev-kit to v${VERSION} [skip ci]"
          git tag "dev-kit--v${VERSION}"
          REMOTE="origin"
          BRANCH="main"
          git push "$REMOTE" "$BRANCH" --follow-tags
