name: version-bump

# Tag-only emission. PRs auto-include their own version bump via
# .githooks/pre-push (on the user's local checkout): any push that
# touches skills/* SKILL.md advances both plugin manifest versions by
# PATCH++. The PR then carries the bumped versions; squash-merge lands
# the bump commit on main; this workflow emits the matching tag.
#
# No more "create bump PR" path. That path was the source of every
# v0.3.X orphan from v0.3.2 onwards (most recently v0.3.13 — see
# `gh run view 29327530942 --log-failed` for the non-fast-forward trace).
# The pre-commit hook + version-freshness CI check (in ci.yml) replace
# the entire bump-PR chain with a contract that's enforced at commit time
# and at PR merge time.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version + emit tag
        run: |
          set -euo pipefail

          # `git tag -a` requires a configured user.name + user.email on
          # the runner. `actions/checkout` configures safe.directory but
          # not user identity, and ubuntu-latest ships no usable global
          # config — without this, the tag step fails with
          # `fatal: unable to auto-detect email address` on the next
          # release push after this workflow lands.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          VERSION="$(jq -r .version .claude-plugin/plugin.json)"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::plugin.json:version=$VERSION is not MAJOR.MINOR.PATCH; aborting"
            exit 1
          fi

          TAG="dev-kit--v${VERSION}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "tag ${TAG} already exists on origin; skipping"
            exit 0
          fi

          # No head-commit-message predicate here. Under the pre-commit
          # auto-bump design, the head commit on main is the squash-merge
          # of the user's PR (title = PR title like "fix(x): ..."), NOT
          # a "chore(release): bump dev-kit to v..." commit. Tag-emission
          # is gated by:
          #   (a) tag-already-exists check above (idempotency)
          #   (b) ci.yml:validate Version freshness check, which fails the
          #       PR if HEAD version <= BASE version. A push-to-main whose
          #       plugin.json:version is unchanged from the last tag will
          #       be filtered out at PR time, so reaching this step
          #       implies the version genuinely advanced.

          # Annotated tag (not lightweight) so downstream tooling gets
          # tagger identity, creation date, and message. Lightweight tags
          # are just ref pointers; many release consumers (changelog
          # generators, marketplace pin logic, version-bump workflow's
          # own idempotency check) expect the metadata.
          git tag -a -m "dev-kit v${VERSION}" "$TAG" origin/main
          git push origin "$TAG"
          echo "tagged ${TAG} (annotated) at origin/main@${VERSION}"
