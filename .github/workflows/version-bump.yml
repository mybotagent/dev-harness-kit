name: version-bump

# Tag-only emission. PRs auto-include their own version bump via
# .githooks/pre-commit (on the user's local checkout): any commit that
# touches skills/* SKILL.md advances .claude-plugin/plugin.json:version
# by PATCH++. The PR then carries the bumped version; squash-merge lands
# the bump commit on main; this workflow emits the matching tag.
#
# No more "create bump PR" path. That path was the source of every
# v0.3.X orphan from v0.3.2 onwards (most recently v0.3.13 — see
# `gh run view 29327530942 --log-failed` for the non-fast-forward trace).
# The pre-commit hook + version-freshness CI check (in ci.yml) replace
# the entire bump-PR chain with a contract that's enforced at commit time
# and at PR merge time.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version + emit tag
        run: |
          set -euo pipefail

          VERSION="$(jq -r .version .claude-plugin/plugin.json)"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::plugin.json:version=$VERSION is not MAJOR.MINOR.PATCH; aborting"
            exit 1
          fi

          TAG="dev-kit--v${VERSION}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "tag ${TAG} already exists on origin; skipping"
            exit 0
          fi

          # Idempotency / sanity guard: only tag if the head commit on
          # main is the bump commit for THIS version. A push-to-main that
          # is NOT a bump (e.g. a force-push, a manual edit) should not
          # produce a spurious tag.
          HEAD_MSG="$(git log -1 --format=%s origin/main)"
          NORMALISED_HEAD_MSG="$(echo "$HEAD_MSG" | tr -d '\r' | tr '\n' ' ' | head -c 200)"
          if ! [[ "$NORMALISED_HEAD_MSG" =~ ^chore\(release\):\ bump\ dev-kit\ to\ v${VERSION}(\ \(#[0-9]+\))?$ ]]; then
            echo "::warning::head commit msg=$HEAD_MSG is not a bump commit for v${VERSION}; tag emit skipped"
            exit 0
          fi

          git tag "$TAG" origin/main
          git push origin "$TAG"
          echo "tagged ${TAG} at origin/main@${VERSION}"
