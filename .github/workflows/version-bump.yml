name: version-bump

# Single source of truth for plugin-version advancement.
#
# Architecture (post-#439):
# - Feature PRs do NOT touch .claude-plugin/plugin.json or
#   .codex-plugin/plugin.json. The PR branch keeps the version it was
#   cut at, so parallel PRs never conflict on the `version` field.
# - .githooks/pre-push enforces "refuse to push if local < origin/main"
#   but does NOT auto-bump. The previous auto-bump behavior was the
#   root cause of the parallel-PR cascade (every push incremented,
#   every merge conflicted).
# - When a PR into main is merged, this workflow:
#     1. Reads the current version from .claude-plugin/plugin.json
#     2. Bumps PATCH (0.3.129 -> 0.3.130)
#     3. Updates both manifests and commits + pushes the bump to main
#     4. Tags the new commit (annotated, idempotent on tag-already-exists)
# - ci.yml's validate-job "Version freshness" check (in
#   tests/test_smoke.py or tests/test_pre_commit_lint.py) continues to
#   require HEAD version > BASE version for PR merges; with this
#   workflow owning the trunk bump, that contract is unchanged.
#
# Ruleset bypass (2026-08-02): `main` is protected by a repository
# Ruleset (not classic branch protection) requiring a PR + 3 status
# checks, with `bypass_actors: [{RepositoryRole: admin, always}]`.
# The default `secrets.GITHUB_TOKEN` authenticates as the "github-actions"
# Integration, which is NOT eligible for ruleset bypass on personal
# (non-org) GitHub accounts — Integration bypass_actors require an
# owner organization. `secrets.DEV_KIT_GITHUB_TOKEN` is a fine-grained
# PAT owned by the repo's admin account, so pushes authenticated with
# it inherit the admin RepositoryRole and bypass the ruleset. This is
# the only way to keep this workflow's direct-push-to-main working
# without installing a dedicated GitHub App.
#
# Trigger: pull_request(closed) + merged==true (2026-08-03), not push.
# The bump commit itself is pushed straight to main with `git push
# origin HEAD:main` -- a `push` event, never a merged PR. Triggering on
# `push: branches: [main]` therefore made the workflow re-fire on its
# own bump commit, which bumped again, which pushed again... an
# unbounded cascade (observed: v0.3.183 -> v0.3.188 in under a minute).
# Gating on "a PR into main was merged" is structurally immune to that
# self-retrigger, since the bump step never goes through a PR.
#
# Bump-PR interop: /dev-kit:bump (skills/bump/SKILL.md) also opens a
# `chore(release): bump dev-kit to v...`-titled PR for manual/race-
# recovery bumps, and merging THAT is a real pull_request(closed) event
# -- it must not be double-bumped. The "Skip re-bump if PR is itself a
# bump" step detects this by PR title and skips the bump-and-commit
# steps, but tagging still runs (skills/bump/SKILL.md explicitly relies
# on this workflow for post-merge tag emission; the skill does no local
# tagging).

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump-and-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DEV_KIT_GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh origin/main (queued-run safety)
        # If a previous workflow run pushed its bump first while this run
        # was queued, our local checkout is stale. Re-fetch + reset to
        # origin/main so the upcoming bump is computed against the
        # latest trunk version and the push is a guaranteed fast-forward.
        # This is the fix for review finding #1 on #439.
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Skip re-bump if PR is itself a bump
        id: idempotency
        # /dev-kit:bump opens a `chore(release): bump dev-kit to v...`
        # PR for manual/race-recovery bumps. Merging it is a real
        # pull_request(closed) event that would otherwise double-bump
        # (the skill already advanced plugin.json). Detect by PR title
        # and skip the bump-and-commit steps below; tagging still runs.
        run: |
          set -euo pipefail
          TITLE=${{ toJSON(github.event.pull_request.title) }}
          if [[ "$TITLE" =~ ^\"chore\(release\):\ bump\ dev-kit\ to\ v ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::merged PR is itself a bump ($TITLE); skipping re-bump, tag still runs."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read current version
        id: read
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version .claude-plugin/plugin.json)"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::plugin.json:version=$VERSION is not MAJOR.MINOR.PATCH; aborting"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute next version (PATCH++)
        id: next
        if: steps.idempotency.outputs.skip != 'true'
        run: |
          set -euo pipefail
          V="${{ steps.read.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$V"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Bump both manifests
        if: steps.idempotency.outputs.skip != 'true'
        run: |
          set -euo pipefail
          NEXT="${{ steps.next.outputs.version }}"
          for f in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            jq --arg v "$NEXT" '.version = $v' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Commit + push version bump
        if: steps.idempotency.outputs.skip != 'true'
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git add .claude-plugin/plugin.json .codex-plugin/plugin.json
          git commit -m "chore(release): bump dev-kit to v${NEXT}"
          # Push to origin/main. The pre-push hook on the runner side
          # does not fire here (workflow runs git push directly), so
          # no recursion.
          git push origin HEAD:main

      - name: Emit annotated tag
        env:
          NEXT: ${{ steps.next.outputs.version }}
          CURRENT: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${NEXT:-$CURRENT}"
          TAG="dev-kit--v${VERSION}"

          # Idempotency: if the tag already exists in local refs
          # (because fetch-depth: 0 fetched refs/tags/*), skip. Same
          # rationale as before — local ref is authoritative; ls-remote
          # is eventually consistent and would let near-simultaneous
          # pushes slip through.
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists locally; skipping"
            exit 0
          fi

          # Annotated (not lightweight) so downstream tooling gets the metadata
          # tagger identity + creation date + message. Lightweight tags
          # are just ref pointers; many release consumers (changelog
          # generators, marketplace pin logic) expect the metadata.
          # Target HEAD (the bump commit just pushed), not origin/main
          # — by the time we reach this step, origin/main may have
          # advanced if another workflow run slipped in between, and
          # tagging origin/main would tag the wrong commit. This is
          # the fix for review finding #2 on #439.
          git tag -a -m "dev-kit v${VERSION}" "$TAG" HEAD
          git push origin "$TAG"
          echo "tagged ${TAG} (annotated) at HEAD=${VERSION}"