name: version-bump

# Single source of truth for plugin-version advancement.
#
# Architecture (post-#439):
# - Feature PRs do NOT touch .claude-plugin/plugin.json or
#   .codex-plugin/plugin.json. The PR branch keeps the version it was
#   cut at, so parallel PRs never conflict on the `version` field.
# - .githooks/pre-push enforces "refuse to push if local < origin/main"
#   but does NOT auto-bump. The previous auto-bump behavior was the
#   root cause of the parallel-PR cascade (every push incremented,
#   every merge conflicted).
# - On push to main (i.e., after a PR lands), this workflow:
#     1. Reads the current version from .claude-plugin/plugin.json
#     2. Bumps PATCH (0.3.129 -> 0.3.130)
#     3. Updates both manifests and commits + pushes the bump to main
#     4. Tags the new commit (annotated, idempotent on tag-already-exists)
# - ci.yml's validate-job "Version freshness" check (in
#   tests/test_smoke.py or tests/test_pre_commit_lint.py) continues to
#   require HEAD version > BASE version for PR merges; with this
#   workflow owning the trunk bump, that contract is unchanged.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh origin/main (queued-run safety)
        # If a previous workflow run pushed its bump first while this run
        # was queued, our local checkout is stale. Re-fetch + reset to
        # origin/main so the upcoming bump is computed against the
        # latest trunk version and the push is a guaranteed fast-forward.
        # This is the fix for review finding #1 on #439.
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Read current version
        id: read
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version .claude-plugin/plugin.json)"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::plugin.json:version=$VERSION is not MAJOR.MINOR.PATCH; aborting"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute next version (PATCH++)
        id: next
        run: |
          set -euo pipefail
          V="${{ steps.read.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$V"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Bump both manifests
        run: |
          set -euo pipefail
          NEXT="${{ steps.next.outputs.version }}"
          for f in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            jq --arg v "$NEXT" '.version = $v' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Commit + push version bump
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git add .claude-plugin/plugin.json .codex-plugin/plugin.json
          git commit -m "chore(release): bump dev-kit to v${NEXT}"
          # Push to origin/main. The pre-push hook on the runner side
          # does not fire here (workflow runs git push directly), so
          # no recursion.
          git push origin HEAD:main

      - name: Emit annotated tag
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          TAG="dev-kit--v${VERSION}"

          # Idempotency: if the tag already exists in local refs
          # (because fetch-depth: 0 fetched refs/tags/*), skip. Same
          # rationale as before — local ref is authoritative; ls-remote
          # is eventually consistent and would let near-simultaneous
          # pushes slip through.
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists locally; skipping"
            exit 0
          fi

          # Annotated (not lightweight) so downstream tooling gets
          # tagger identity + creation date + message. Lightweight tags
          # are just ref pointers; many release consumers (changelog
          # generators, marketplace pin logic) expect the metadata.
          # Target HEAD (the bump commit just pushed), not origin/main
          # — by the time we reach this step, origin/main may have
          # advanced if another workflow run slipped in between, and
          # tagging origin/main would tag the wrong commit. This is
          # the fix for review finding #2 on #439.
          git tag -a -m "dev-kit v${VERSION}" "$TAG" HEAD
          git push origin "$TAG"
          echo "tagged ${TAG} (annotated) at HEAD=${VERSION}"