name: version-bump

# Single source of truth for plugin-version advancement.
#
# Architecture (post-#507):
# - Feature PRs do NOT touch .claude-plugin/plugin.json or
#   .codex-plugin/plugin.json. The PR branch keeps the version it was
#   cut at, so parallel PRs never conflict on the `version` field.
# - .githooks/pre-push enforces "refuse to push if local < origin/main"
#   but does NOT auto-bump. The previous auto-bump behavior was the
#   root cause of the parallel-PR cascade (every push incremented,
#   every merge conflicted).
# - PR #507 enabled server-side branch protection on main with
#   enforce_admins=true. The previous direct-push pattern
#   (git push origin HEAD:main) now fails with GH006 because the
#   github-actions bot cannot bypass the protection rule.
# - This workflow opens a PR `bump/vX.Y.Z` -> main. It does NOT auto-merge:
#   a human (or a separately authorized workflow) must merge the PR.
# - The generated PR uses GITHUB_TOKEN. GitHub suppresses downstream
#   pull_request workflow events from that token, so required checks may need
#   a human or separately authorized workflow to run before merging.
# - The annotated tag is emitted on the bump branch's HEAD before the
#   PR is opened. After squash-merge, main will have a different
#   commit (the squash result), but tags are independent refs — the
#   tag still points to the source commit which is the authoritative
#   "this is the vX.Y.Z bump" commit.
# - Idempotency: if the current-version tag already exists on origin,
#   a previous run already bumped this version. The idempotency output gates
#   every later step, so the workflow exits without creating another PR.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh origin/main (queued-run safety)
        # If a previous workflow run pushed its bump first while this run
        # was queued, our local checkout is stale. Re-fetch + reset to
        # origin/main so the upcoming bump is computed against the
        # latest trunk version and the push is a guaranteed fast-forward.
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Read current version
        id: read
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version .claude-plugin/plugin.json)"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::plugin.json:version=$VERSION is not MAJOR.MINOR.PATCH; aborting"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute next version (PATCH++)
        id: next
        run: |
          set -euo pipefail
          V="${{ steps.read.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$V"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Idempotency check (skip if already bumped)
        id: idempotency
        # If the tag for the CURRENT version already exists on origin, a
        # previous run already completed this bump. Expose the result so every
        # state-changing step below can be skipped by a GitHub Actions `if:`.
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          TAG="dev-kit--v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}$"; then
            echo "tag ${TAG} already exists on origin; version already bumped — skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create bump branch
        if: steps.idempotency.outputs.exists != 'true'
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="bump/v${NEXT}"
          git checkout -b "$BRANCH"

      - name: Bump both manifests
        if: steps.idempotency.outputs.exists != 'true'
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          for f in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            jq --arg v "$NEXT" '.version = $v' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Commit + push bump branch
        if: steps.idempotency.outputs.exists != 'true'
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="bump/v${NEXT}"
          git add .claude-plugin/plugin.json .codex-plugin/plugin.json
          git commit -m "chore(release): bump dev-kit to v${NEXT}"
          git push -u origin "$BRANCH"

      - name: Emit annotated tag (pre-merge)
        if: steps.idempotency.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          TAG="dev-kit--v${VERSION}"
          # Pre-merge: tag the bump commit (the source commit) before
          # opening the PR. After squash-merge, main will have a
          # different commit (the squash result), but the tag still
          # points to the source commit which is the authoritative
          # "this is the v${VERSION} bump" commit. Tags are
          # independent refs and stay valid even when the branch is
          # merged.
          git tag -a -m "dev-kit v${VERSION}" "$TAG" HEAD
          git push origin "$TAG"
          echo "tagged ${TAG} (annotated) at HEAD=${VERSION}"

      - name: Open version bump PR (awaiting human merge)
        if: steps.idempotency.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="bump/v${NEXT}"
          BODY="Auto-generated version bump by the version-bump workflow.

          - Bumps PATCH: v${NEXT}
          - Awaiting human merge; this workflow does not auto-merge the PR.
          - Tag \`dev-kit--v${NEXT}\` has been emitted on the bump commit.

          Note: GitHub suppresses downstream pull_request workflow events from
          GITHUB_TOKEN-created pull requests. A human or separately authorized
          workflow may need to run the required checks before merging."
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): bump dev-kit to v${NEXT}" \
            --body "$BODY"
          # Bump commit + branch + PR created; awaiting human merge.
