name: version-bump

# Auto-bump PATCH in .claude-plugin/plugin.json on every merged PR to
# main, creating the dev-kit--vX.Y.Z tag. With marketplace autoUpdate
# set, /plugin marketplace update dev-kit then /reload-skills refresh
# the local cache. Per the docs release-flow note: bump it every time
# you want users to receive changes. Loop guard: the bump records
# itself with [skip ci] so the next upload does not re-trigger.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump PATCH in plugin.json
        run: |
          set -euo pipefail
          VERSION=$(jq -r ".version" .claude-plugin/plugin.json)
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "plugin.json:version=$VERSION is not MAJOR.MINOR.PATCH; aborting"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          jq --arg v "$NEW_VERSION" ".version = $v" .claude-plugin/plugin.json \\
            > .claude-plugin/plugin.json.tmp
          mv .claude-plugin/plugin.json.tmp .claude-plugin/plugin.json
          echo "version=$NEW_VERSION"

      - name: Record and upload
        run: |
          set -euo pipefail
          VERSION=$(jq -r ".version" .claude-plugin/plugin.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "chore(release): bump dev-kit to v${VERSION} [skip ci]"
          git tag "dev-kit--v${VERSION}"
          REMOTE="origin"
          BRANCH="main"
          git push "$REMOTE" "$BRANCH" --follow-tags
