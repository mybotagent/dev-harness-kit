name: CI

on:
  push:
    branches: [main]
    # POLICY: this repo requires PR review before merge to main.
    # Direct push to main triggers branch-policy job (warn-only).
    # Enforced via .githooks/pre-push locally.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Direct push to main — policy violation recorded
        run: |
          echo "::warning::Direct push to 'main' detected. PR-only workflow violated."
          echo "  Commit:  ${{ github.sha }}"
          echo "  Author:  ${{ github.actor }}"
          echo "  Event:   push (not pull_request)"
          echo ""
          echo "  Policy: this repo requires PR review before merge to main."
          echo ""
          echo "  Recommended fix:"
          echo "    1. Revert:  git reset --hard \$REMOTE_PREVIOUS_SHA  (force-push)"
          echo "    2. Branch:  git checkout -b feat/<name>"
          echo "    3. Push:    git push -u origin feat/<name>"
          echo "    4. PR:      gh pr create --base main"
          echo ""
          echo "  This is logged but does NOT hard-fail (emergency bypass allowed)."

  test:
    name: test (python 3.12)
    runs-on: ubuntu-latest
    # Skip on bump-PRs (title is `chore(release): bump dev-kit to vX.Y.Z`).
    # Per-workflow replacement for the previous convention of putting
    # [skip ci] in the bump commit message — that suppressed EVERY
    # workflow on the bump push, including version-bump.yml's own
    # auto-tag step. See also review.yml for the same pattern.
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && !startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest + PyYAML
        run: pip install --quiet pytest pyyaml
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/lib

  validate:
    name: validate
    runs-on: ubuntu-latest
    # Skip on bump-PRs — same rationale as `test:` above. The bump commit
    # is auto-generated; running the full validate suite on it would
    # only re-check plugin manifest shape, skill count, and bash hook
    # syntax, all of which are invariant under a 0.3.X → 0.3.Y bump.
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && !startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v')
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed for the Version freshness step (git show
          # $BASE_SHA:.claude-plugin/plugin.json); the default
          # fetch-depth: 1 would leave BASE_SHA unreachable on the local
          # clone and break that step with
          #   "fatal: path '.claude-plugin/plugin.json' exists on disk,
          #    but not in '<BASE_SHA>'"
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate plugin manifests
        run: |
          python3 -c "
          import json, pathlib
          mp = json.loads(pathlib.Path('.claude-plugin/marketplace.json').read_text())
          pl = json.loads(pathlib.Path('.claude-plugin/plugin.json').read_text())
          # marketplace wraps the plugin under plugins[0]
          mp_plugin = mp['plugins'][0]
          assert mp_plugin['name'] == 'dev-kit', f\"marketplace plugin name mismatch: {mp_plugin['name']}\"
          assert pl['name'] == 'dev-kit', f\"plugin name mismatch: {pl['name']}\"
          # 'version' is OPTIONAL per Claude Code plugin docs (marketplace pins
          # by commit SHA when omitted). Per docs: avoid setting version in BOTH
          # plugin.json and the marketplace entry (plugin.json wins anyway
          # without warning). BOTH-set is the doc-banned anti-pattern; NEITHER-
          # set is SHA-pinned (also ok). Pitfalls in this Python source:
          #   (a) no ASCII backticks in comments -- bash interprets them as
          #       command substitution inside the surrounding python3 -c ... string.
          #   (b) no unescaped ASCII double-quote chars -- they terminate the
          #       bash-quoted python3 -c argument early.
          pl_v, mp_v = pl.get('version'), mp_plugin.get('version')
          assert not (pl_v and mp_v), (
              f'version must be set in at most one of plugin.json/marketplace.json '
              f'(docs anti-pattern to set both -- plugin.json wins anyway); '
              f'got plugin.json={pl_v!r} marketplace={mp_v!r}'
          )
          tag = f' v{pl_v}' if pl_v else f' {mp_v}' if mp_v else ' (version-less, SHA-pinned)'
          src = 'plugin.json' if pl_v else 'marketplace' if mp_v else 'SHA-pinned'
          print(f'manifests OK (name=dev-kit{tag}, source={src})')
          "

      - name: Validate skill count + flat layout
        run: |
          python3 -c "
          import pathlib
          skills = sorted(pathlib.Path('skills').glob('*/SKILL.md'))
          # Skill COUNT is asserted by tests/test_smoke.py:test_skills_count
          # (SKILL_COUNT constant + 44 check); duplicating it here would
          # create a second mirror that drifts on every skill add. The two
          # unique invariants this job owns are below.
          # flat: no nested SKILL.md
          nested = list(pathlib.Path('skills').glob('*/*/SKILL.md'))
          assert not nested, f'nested SKILL.md found: {nested}'
          # name == dir for each
          for s in skills:
              assert s.parent.name == s.read_text().split('\n', 5)[1].split(':',1)[1].strip(), \
                  f'name mismatch in {s}'
          print(f'all {len(skills)} skills flat + name==dir OK')
          "

      - name: Version freshness (PR head > PR base, strict)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_VERSION="$(git show "$BASE_SHA:.claude-plugin/plugin.json" | jq -r .version)"
          HEAD_VERSION="$(jq -r .version .claude-plugin/plugin.json)"

          # STRICT inequality: HEAD must be > BASE (not >=). The auto-bump
          # source of truth is .githooks/pre-push, which advances PATCH
          # to (BASE + 1) right before pushing. After a successful pre-push,
          # HEAD == BASE+1, so this check passes. If HEAD == BASE, the
          # user pushed with --no-verify (bypassing pre-push) and the
          # version wasn't advanced; we refuse to merge.
          #
          # If HEAD < BASE: another PR merged first and advanced main past
          # this branch's tip. The user must rebase; pre-push will then
          # auto-bump to (BASE + 1) on the next push.
          HIGHER="$(printf '%s\n%s\n' "$BASE_VERSION" "$HEAD_VERSION" | sort -V | tail -1)"
          if [ "$HIGHER" = "$BASE_VERSION" ]; then
            echo "::error::PR head version $HEAD_VERSION is NOT strictly greater than base version $BASE_VERSION"
            echo "::error::Either: (a) you pushed with --no-verify and bypassed the pre-push auto-bump,"
            echo "::error::or (b) another PR merged first and advanced main past this branch."
            echo "::error::Fix (a): rebase onto origin/main; pre-push will auto-bump the next PATCH on push."
            echo "::error::Fix (b): rebase onto origin/main, then push; pre-push will advance past the new base."
            exit 1
          fi
          echo "version-freshness OK (head=$HEAD_VERSION > base=$BASE_VERSION)"

      - name: Bash hook syntax
        run: |
          for h in hooks/*.sh; do
            bash -n "$h"
          done
          echo "hooks OK ($(ls hooks/*.sh | wc -l | tr -d ' ') scripts)"

      - name: Pre-push hook syntax
        run: bash -n .githooks/pre-push

      - name: Python module imports
        run: |
          PYTHONPATH=lib python3 -c "
          import state_codec, active_hooks_codec, write_project_md, execute
          print('all 4 lib modules importable')
          "
