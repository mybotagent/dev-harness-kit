name: PR Review

# Auto-run /dev-kit:review (3-dim) and /dev-kit:security (10-dim OWASP) on every
# PR, in parallel. dev-kit plugin is installed from this checkout via a
# local marketplace symlink so the namespaced skills resolve.
#
# Severity gate + auto-approve (per claude-review-plugins spec):
#   Approve            (no critical, no major in BOTH review + security) → success + auto-approve
#   Changes Requested  (any major in either)                              → failure
#   Blocked            (any critical in either)                           → failure
#
# Empty-verdict gate: for pull_request events, missing verdict = exit 1
# (strict). For workflow_dispatch, missing verdict = warn + exit 0
# (manual override allowed).
#
# Secret name `MINMAX_API_KEY` is preserved from prior workflow — do not
# rename (would break existing repo secret config).
#
# Provider selection (pull_request events): controlled by the git-tracked
# file `.github/ci-review-provider.txt` (one of `minimax` / `anthropic` /
# `deepseek` on its own line, defaults to `minimax` if the file is missing
# or empty). This is a plain local file — edit it, commit, push, and the
# very next PR-triggered run picks it up. No GitHub Settings UI, no
# workflow_dispatch, no automatic fallback chain to reason about: whatever
# is committed on the PR's branch (checked out by `actions/checkout` below)
# is what runs. workflow_dispatch still accepts an explicit
# `review_provider` input that overrides the file for a single manual run.
# Each provider requires its matching secret to be configured:
# `MINMAX_API_KEY`, `ANTHROPIC_API_KEY`, or `DEEPSEEK_API_KEY`.
#
# CI (a GitHub-hosted runner) can never read your local .env — it only
# ever sees what's on the branch it checks out. `.githooks/pre-commit`
# bridges that gap: it reads `CI_REVIEW_PROVIDER` from the *main
# checkout's* `.env` on every local commit and auto-syncs this file to
# match, so `.env` stays the single source of truth you actually edit —
# see `.env.example` for the `CI_REVIEW_PROVIDER` key.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      review_provider:
        description: "Provider for this run (default: .github/ci-review-provider.txt, else minimax)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - minimax
          - anthropic
          - deepseek
      pr_number:
        description: "PR number to review"
        required: false
        type: string

jobs:
  review:
    name: /dev-kit:review (3-dim)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip on bump-PRs (title is `chore(release): bump dev-kit to vX.Y.Z`).
    # The bump content is version-bump.yml-generated and is auto-merged by
    # `peter-evans/enable-pull-request-automerge`. Running /dev-kit:review
    # on it would only confirm "plugin.json version bumped by 0.0.1" — no
    # reviewable change. Replaces the previous `[skip ci]` literal that
    # globally suppressed ALL workflows on the bump commit (which broke
    # the round-trip — see version-bump.yml).
    if: "!startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v')"
    outputs:
      verdict: ${{ steps.extract_verdict.outputs.verdict }}
      agent_ran: ${{ steps.extract_verdict.outputs.agent_ran }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      MINIMAX_BASE_URL: https://api.minimax.io/anthropic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dev-kit plugin from local checkout
        run: |
          mkdir -p ~/.claude/plugins/marketplaces
          ln -sfn "$GITHUB_WORKSPACE" ~/.claude/plugins/marketplaces/dev-kit
          # verify the symlink + manifest exist
          test -f ~/.claude/plugins/marketplaces/dev-kit/.claude-plugin/plugin.json
          test -d ~/.claude/plugins/marketplaces/dev-kit/skills/review
          echo "dev-kit plugin symlinked: $(readlink ~/.claude/plugins/marketplaces/dev-kit)"

      - name: Resolve PR + provider
        id: provider
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            provider="${{ github.event.inputs.review_provider }}"
            [ -z "${{ github.event.inputs.pr_number }}" ] && { echo "::error::pr_number required"; exit 1; }
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            provider="$(tr -d '[:space:]' < .github/ci-review-provider.txt 2>/dev/null || true)"
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi
          echo "provider=${provider:-minimax}" >> "$GITHUB_OUTPUT"

      - name: Run /dev-kit:review via MiniMax
        if: steps.provider.outputs.provider == 'minimax'
        # MiniMax channel: env-only (no with.anthropic_api_key to avoid mixed auth).
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.MINMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINMAX_API_KEY }}
          ANTHROPIC_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_SONNET_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_OPUS_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'MiniMax-M3[1m]'
        uses: anthropics/claude-code-action@v1
        with:
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            /dev-kit:review --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the standard two-layer output (PR summary at top, per-finding
            inline comments). The summary MUST begin with a single line exactly
            of the form:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked

            Map verdict strictly to severity (do NOT inflate):
              - 🔴 critical ≥ 1          → **Verdict:** Blocked
              - 🟠 major  ≥ 1, 🔴 = 0    → **Verdict:** Changes Requested
              - no 🔴, no 🟠             → **Verdict:** Approve
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:review via Claude Code opt-in
        if: steps.provider.outputs.provider == 'anthropic'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            /dev-kit:review --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the standard two-layer output. The summary MUST begin with:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:review via DeepSeek
        if: steps.provider.outputs.provider == 'deepseek'
        # DeepSeek channel: env-only, same pattern as MiniMax above.
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: 'deepseek-v4-pro'
          ANTHROPIC_DEFAULT_SONNET_MODEL: 'deepseek-v4-flash'
          ANTHROPIC_DEFAULT_OPUS_MODEL: 'deepseek-v4-pro'
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'deepseek-v4-flash'
        uses: anthropics/claude-code-action@v1
        with:
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            /dev-kit:review --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the standard two-layer output. The summary MUST begin with:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Extract review verdict
        id: extract_verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -uo pipefail
          # Most recent claude[bot] comment that contains a **Verdict:** line.
          # In track_progress mode the action updates ONE comment per job, so
          # "most recent" = this job's comment.
          verdict="$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select((.user.login // "") | startswith("claude")) | .body' \
            | grep -E '\*\*Verdict:\*\*' | tail -1 \
            | grep -oE '\*\*Verdict:\*\*\s*(Approve|Blocked|Changes Requested)' \
            | awk '{print $NF}' || true)"
          # Issue #212-C1-fix: detect anthropics/claude-code-action@v1 skip.
          # When the PR modifies files under .github/workflows/, the action
          # refuses to run and exits 0 with NO claude[bot] comment posted.
          # The job's result is then "success" (the action's exit-0 mask),
          # but the agent never produced a verdict. The downstream gate
          # would see verdict="" + result=success and silently default to
          # Approve — that masked-bug fix would be itself masked. Surface
          # the skip by reading the comment count: 0 comments from a
          # claude-prefixed user means the action was skipped, regardless
          # of verdict text (an empty verdict might also be a typo or a
          # rate-limit aftermath, but a 0-count is unambiguous).
          claude_count=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select((.user.login // "") | startswith("claude"))] | length')
          agent_ran="false"
          if [ "$claude_count" -gt 0 ]; then
            agent_ran="true"
          fi
          echo "review_verdict=${verdict:-<none>}  claude_comments=${claude_count}  agent_ran=${agent_ran}"
          echo "verdict=${verdict:-}" >> "$GITHUB_OUTPUT"
          echo "agent_ran=${agent_ran}" >> "$GITHUB_OUTPUT"

  security:
    name: /dev-kit:security (10-dim OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip on bump-PRs — same rationale as `review:` above.
    if: "!startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v')"
    outputs:
      verdict: ${{ steps.extract_verdict.outputs.verdict }}
      agent_ran: ${{ steps.extract_verdict.outputs.agent_ran }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      MINIMAX_BASE_URL: https://api.minimax.io/anthropic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dev-kit plugin from local checkout
        run: |
          mkdir -p ~/.claude/plugins/marketplaces
          ln -sfn "$GITHUB_WORKSPACE" ~/.claude/plugins/marketplaces/dev-kit
          test -f ~/.claude/plugins/marketplaces/dev-kit/.claude-plugin/plugin.json
          test -d ~/.claude/plugins/marketplaces/dev-kit/skills/security
          echo "dev-kit plugin symlinked: $(readlink ~/.claude/plugins/marketplaces/dev-kit)"

      - name: Resolve PR + provider
        id: provider
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            provider="${{ github.event.inputs.review_provider }}"
            [ -z "${{ github.event.inputs.pr_number }}" ] && { echo "::error::pr_number required"; exit 1; }
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            provider="$(tr -d '[:space:]' < .github/ci-review-provider.txt 2>/dev/null || true)"
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi
          echo "provider=${provider:-minimax}" >> "$GITHUB_OUTPUT"

      - name: Run /dev-kit:security via MiniMax
        if: steps.provider.outputs.provider == 'minimax'
        env:
          ANTHROPIC_BASE_URL: ${{ env.MINIMAX_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.MINMAX_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINMAX_API_KEY }}
          ANTHROPIC_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_SONNET_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_OPUS_MODEL: 'MiniMax-M3[1m]'
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'MiniMax-M3[1m]'
        uses: anthropics/claude-code-action@v1
        with:
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            /dev-kit:security --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the security summary (per-category breakdown table + Verdict).
            The summary MUST begin with a single line exactly of the form:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked

            Map verdict per spec:
              - 🔴 critical ≥ 1          → **Verdict:** Blocked
              - 🟠 major  ≥ 1, 🔴 = 0    → **Verdict:** Changes Requested
              - no 🔴, no 🟠             → **Verdict:** Approve
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:security via Claude Code opt-in
        if: steps.provider.outputs.provider == 'anthropic'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            /dev-kit:security --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the security summary. The summary MUST begin with:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Run /dev-kit:security via DeepSeek
        if: steps.provider.outputs.provider == 'deepseek'
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: 'deepseek-v4-pro'
          ANTHROPIC_DEFAULT_SONNET_MODEL: 'deepseek-v4-flash'
          ANTHROPIC_DEFAULT_OPUS_MODEL: 'deepseek-v4-pro'
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'deepseek-v4-flash'
        uses: anthropics/claude-code-action@v1
        with:
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            /dev-kit:security --diff ${{ github.repository }}/pull/${{ steps.provider.outputs.pr_number }}

            Render the security summary. The summary MUST begin with:

              **Verdict:** Approve
              **Verdict:** Changes Requested
              **Verdict:** Blocked
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Extract security verdict
        id: extract_verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -uo pipefail
          # Most recent claude[bot] comment that contains a **Verdict:** line.
          # In track_progress mode the action updates ONE comment per job, so
          # "most recent" = this job's comment (review job's older comments
          # come before security's in chronological order, so we still want
          # the latest = security's).
          verdict="$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select((.user.login // "") | startswith("claude")) | .body' \
            | grep -E '\*\*Verdict:\*\*' | tail -1 \
            | grep -oE '\*\*Verdict:\*\*\s*(Approve|Blocked|Changes Requested)' \
            | awk '{print $NF}' || true)"
          # Issue #212-C1-fix: same skip-detector as review job. A 0 count
          # of claude-prefixed comments means anthropics/claude-code-action@v1
          # skipped due to workflow validation, NOT that the agent posted
          # nothing — in which case the gate would silently default to
          # Approve per the empty-verdict tolerance. agent_ran=false tells
          # the gate to hard-fail with the bootstrap-PR message.
          claude_count=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select((.user.login // "") | startswith("claude"))] | length')
          agent_ran="false"
          if [ "$claude_count" -gt 0 ]; then
            agent_ran="true"
          fi
          echo "security_verdict=${verdict:-<none>}  claude_comments=${claude_count}  agent_ran=${agent_ran}"
          echo "verdict=${verdict:-}" >> "$GITHUB_OUTPUT"
          echo "agent_ran=${agent_ran}" >> "$GITHUB_OUTPUT"

  gate:
    name: severity gate (review + security)
    runs-on: ubuntu-latest
    needs: [review, security]
    # Skip on bump-PRs: `review` and `security` are skipped via their own
    # `if:` filters above; `needs: [review, security]` with `if: always()`
    # would still cause gate to run. Mirror the skip here so the entire
    # job chain is silenced in one logical place for bump PRs. The `if:`
    # is wrapped in `always() && ...` so the gate still runs on partial
    # upstream failures for non-bump PRs.
    if: |
      always() &&
      !startsWith(github.event.pull_request.title, 'chore(release): bump dev-kit to v')
    # No permissions: gate only needs `gh api` (read) for verdict extraction
    # and does NOT auto-approve. Actual PR approval is the human's job.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Combined verdict gate
        run: |
          # Read verdicts directly from each job's outputs (set by the
          # 'Extract <skill> verdict' post-step in review + security jobs).
          # This is robust: no fragile comment-body matching required.
          R="${{ needs.review.outputs.verdict }}"
          S="${{ needs.security.outputs.verdict }}"
          # agent_ran: false when anthropics/claude-code-action@v1 SKIPPED
          # the run due to workflow-validation. Set by the 'Extract <skill>
          # verdict' post-step based on whether any claude-prefixed comment
          # exists on the PR. The action skips silently on PRs that touch
          # .github/workflows/* (and on bootstrap-PRs that add the file).
          R_AGENT="${{ needs.review.outputs.agent_ran }}"
          S_AGENT="${{ needs.security.outputs.agent_ran }}"
          # Job-level results: success | failure | cancelled | skipped.
          # Issue #212-C1: if the upstream agent job FAILED, the empty
          # verdict is "agent never ran" (e.g. DEV_KIT_GITHUB_TOKEN missing,
          # action rate-limit, install error), NOT "agent ran and gave
          # no severity". Distinct failure mode → distinct gate behavior:
          # hard-fail (exit 1) so the install problem surfaces instead of
          # being papered over by the Approve default.
          R_RESULT="${{ needs.review.result }}"
          S_RESULT="${{ needs.security.result }}"
          EVENT="$EVENT_NAME"
          echo "review=$R (result=$R_RESULT, agent_ran=$R_AGENT)"
          echo "security=$S (result=$S_RESULT, agent_ran=$S_AGENT)"

          # Issue #212-C1-fix: anthropics/claude-code-action@v1 exits 0 with
          # a "workflow validation skip" warning when the PR's head differs
          # from the default branch under .github/workflows/. Result is
          # "success" (the action's exit-0 mask), but the agent never ran —
          # `agent_ran=false` is the unambiguous signal. This case is the
          # classic "PR that adds/modifies review.yml" bootstrap-PR scenario.
          # The previous version of this gate defaulted to Approve on empty
          # verdict, which masked the skip as a silent pass.
          if [ "$R_AGENT" = "false" ] || [ "$S_AGENT" = "false" ]; then
            {
              echo "::error::review+security gate: AI agent was skipped"
              echo "  review.agent_ran=$R_AGENT verdict=$R"
              echo "  security.agent_ran=$S_AGENT verdict=$S"
              echo
              echo "  anthropics/claude-code-action@v1 refused to run on this PR."
              echo "  The action refuses any PR whose head differs from the default"
              echo "  branch under .github/workflows/*. Result is success (exit-0),"
              echo "  but no claude[bot] comment was posted — the 'Approve' verdict"
              echo "  you see in the gate is the empty-verdict tolerance, NOT an"
              echo "  actual AI review."
              echo
              echo "  Fix:"
              echo "    1. Merge this PR's workflow changes to main first."
              echo "    2. Re-open or sync from the updated default branch."
              echo "    3. Future PRs (without workflow modifications) will run the"
              echo "       agent normally and post real verdicts + inline comments."
            } >&2
            exit 1
          fi

          # Hard-fail gate if EITHER upstream job actually failed (not
          # skipped/cancelled). An empty verdict + failure result is the
          # canonical "install is broken" signature from issue #212.
          if [ "$R_RESULT" = "failure" ] || [ "$S_RESULT" = "failure" ]; then
            {
              echo "::error::review+security gate: upstream agent job failed"
              echo "  review.result=$R_RESULT verdict=$R"
              echo "  security.result=$S_RESULT verdict=$S"
              echo
              echo "  This means the /dev-kit:* agent never produced a verdict,"
              echo "  most often because one of:"
              echo "    - DEV_KIT_GITHUB_TOKEN secret missing or expired"
              echo "    - MINIMAX_API_KEY / ANTHROPIC_API_KEY / DEEPSEEK_API_KEY missing"
              echo "    - dev-kit plugin install failed (see 'Install dev-kit plugin' step)"
              echo "    - anthropics/claude-code-action@v1 rate-limit / transient network error"
              echo
              echo "  The severity gate does NOT default to Approve on failure"
              echo "  (that would mask install bugs -- issue #212-C1)."
            } >&2
            exit 1
          fi

          # Tolerate missing verdicts in BOTH event modes WHEN the upstream
          # job actually succeeded / was skipped (workflow-validation skip on
          # the very PR that ADDS .github/workflows/review.yml, action
          # rate-limit masked by success, transient network error). The
          # fix: default to Approve + ::warning:: so the human gate
          # (REVIEW_REQUIRED / CHANGES_REQUESTED on the PR) is what
          # actually blocks merge, not a single missing agent verdict.
          [ -z "$R" ] && { echo "::warning::review verdict missing (event=$EVENT, result=$R_RESULT); defaulting to Approve"; R="Approve"; }
          [ -z "$S" ] && { echo "::warning::security verdict missing (event=$EVENT, result=$S_RESULT); defaulting to Approve"; S="Approve"; }

          # worst-of wins
          rank() { case "$1" in Blocked) echo 2 ;; "Changes"*) echo 1 ;; Approve) echo 0 ;; *) echo 99 ;; esac; }
          r=$(rank "$R"); s=$(rank "$S")
          worst=$([ "$r" -ge "$s" ] && echo "$R" || echo "$S")
          echo "Combined worst verdict: $worst"

          # Tolerate unparseable verdicts (e.g. "Requested", "Skipped", or
          # unexpected formats from the /dev-kit:* agents): treat as non-
          # blocking by analogy with the workflow_dispatch branch above — the
          # human gate (REVIEW_REQUIRED / CHANGES_REQUESTED) is what actually
          # blocks merge, not a single regex trip.
          if ! { [ "$worst" = "Approve" ] || [ "$worst" = "Changes Requested" ] || [ "$worst" = "Blocked" ]; }; then
            echo "::warning::Unparseable verdict '$worst' (review='$R' security='$S'); treating as non-blocking."
            exit 0
          fi

          case "$worst" in
            Approve) exit 0 ;;
            "Changes"*) echo "::error::Changes Requested (review=$R security=$S)"; exit 1 ;;
            Blocked) echo "::error::Blocked (review=$R security=$S)"; exit 1 ;;
          esac
