title: "12 — 공개 질문 (#280 스레드)"
status: design-discussion
issue: 280
date: 2026-07-21
tags: [open-questions, consensus, issue-280]
sections:
  - title: 정의
    body: |
      #280 스레드에서 컨센서스가 필요한 결정. 각 질문은 **출처 파일 + 잠긴
      결정 + 답변별 영향**을 명시한다. 합의되지 않으면 Phase별로 PR이
      보류된다.

  - title: Q1 — Phase 5 단계 상한 (리서치 강도)
    body: |
      **출처**: `06-external-verifier.html`, `11-migration-phases.html` Phase 5.

      **잠긴 결정**: 결정 7 (4단계 에스컬레이션: Phase 0–3).

      **질문**: v1에서 Phase 0–1만 출시하고 Phase 2–3 (헤드리스, 풀
      헤드리스)는 v2로 미룰 것인가? 비용 (특히 Playwright 풀 브라우저
      부팅) vs 정확성 트레이드오프.

      | 옵션 | 비용 | 정확성 |
      |------|------|--------|
      | v1 = Phase 0–1만 | 낮음 | 중간 (인증 만나는 일부 사이트 미지원) |
      | v1 = Phase 0–3 | 높음 | 높음 |

      **해제 영향**: Phase 5 출시 시점이 미뤄질 수 있다 (옵션 A 선택 시).

  - title: Q2 — verification 게이트의 hard/soft 구분
    body: |
      **출처**: `05-value-gate.html`, `06-external-verifier.html`.

      **잠긴 결정**: 결정 6 (verification 게이트 잠금).

      **질문**: Plan-value 평가의 `no-go` 게이트는 hard (위험 차원 < 2 =
      무조건 kill). 리서치 verification 게이트도 동일해야 하는가, 아니면
      1차 자료 hard / 2차 자료 soft로 차등?

      | 옵션 | 강도 |
      |------|------|
      | 모두 hard | 강함; 일부 리서치 거부 가능 |
      | 1차 hard / 2차 soft | 출처별 차등; 리서치 거부율 감소 |

      **해제 영향**: 결정 6 구현 복잡도.

  - title: Q3 — Phase 0 어댑터 출시 범위
    body: |
      **출처**: `07-runtime-portability.html`, `11-migration-phases.html` Phase 0.

      **잠긴 결정**: 결정 8 (단일 런타임 종속 기각).

      **질문**: v1에서 claude_code 어댑터만 출시하고 codex 어댑터는
      Phase 1과 동시 출시가 적절한가, 아니면 Phase 0에서 둘 다 출시해야
      하는가?

      | 옵션 | Phase 0 비용 | 리스크 |
      |------|-------------|--------|
      | claude_code만 (codex = Phase 1) | 낮음 | Phase 1이 결정 8 보장 못함 |
      | 둘 다 (claude_code + codex) | 중간 | 결정 8이 Phase 0부터 완전 |

      **해제 영향**: Phase 0 일정 + Phase 1의 결정 8 검증.

  - title: Q4 — 런타임 자동 감지 정책
    body: |
      **출처**: `07-runtime-portability.html`.

      **질문**: `claude_code.is_current() or codex.is_current()`가
      **모호한** 상황 (예: Codex 검출 + Claude 환경 변수 존재) 에서의
      정책은?

      | 옵션 | 동작 |
      |------|------|
      | 첫 번째 매치 우선 | 결정적이지만 silent conflict 가능 |
      | 명시적 에러 + 종료 | 안전하지만 자동화 흐름 깨짐 |
      | 환경 변수 우선 | 일반적으로 명확하지만 예외 처리 필요 |

      **해제 영향**: 런타임 어댑터 구현 디테일.

  - title: Q5 — 자동 코드 생성 영감의 미래 이슈
    body: |
      **출처**: `10-decision-record.html` 결정 1, `08-external-references.html`
      AEGIS 비판.

      **잠긴 결정**: 결정 1 (자동 코드 생성 기각).

      **질문**: AEGIS Evolver의 영감을 자동화로 향한 **별도 이슈**로
      다룰 의향이 있는가? (결정 1을 잠금 유지하면서 별도 트랙) 또는
      영구 차단?

      **해제 영향**: 본 통합안과 별도 트랙이 열린다면 L7 재평가 필요.

  - title: Q6 — hermes 자기 개선 비전 적용 범위
    body: |
      **출처**: `08-external-references.html` hermes 비판, `04-quality-judge.html`.

      **잠긴 결정**: 결정 2 (자가 평가 기각).

      **질문**: hermes의 *메모리 + 스킬 자기 개선* 비전이 우리 시스템에서
      자동 생성 가능한 산출물이 있는가? 예: 인터뷰 질문 템플릿이 사용
      패턴에서 자동 진화 — L7 위험이 낮다고 판단하는가?

      **해제 영향**: 결정 2의 경계 명세화.

  - title: Q7 — LCS의 런타임 의존 리소스의 partial 응답 정책
    body: |
      **출처**: `02-live-context-server.html` §(런타임 중립성).

      **질문**: 런타임 어댑터 (tokens.py, sessions.py) 미설치 시 LCS는
      어떻게 응답해야 하는가? `lcs://sessions/<id>`와 `lcs://spend/<window>`이
      partial status로 응답하면 다른 리소스도 영향받는가?

      **해제 영향**: LCS 응답 스키마 (v2 추가 시).

  - title: Q8 — CI 매트릭스의 비용 균형
    body: |
      **출처**: `07-runtime-portability.html` CI 매트릭스.

      **질문**: mock 어댑터로 양쪽 런타임 시뮬레이션 가능한 부분과 실제
      런타임 binary가 필요한 부분의 경계는? 비용 vs 정확성.

      **해제 영향**: CI 인프라 비용.

  - title: "Q9 — llm_judge 재사용 범위"
    body: |
      **출처**: `03-ambiguity-resolver.html`, `09-consolidated-architecture.html`.

      **질문**: 인터뷰 / 플랜 가치 / 리서치 / 평가의 점수 계산이 모두
      LLM judge 기반. 기존 `lib/llm_judge.py:call_judge` + 각 도메인
      프롬프트 (`eval/prompts/judge-plan.md` 등)를 재사용할 것인가,
      아니면 각 하네스가 자체 judge prompt + 호출을 가질 것인가?

      | 옵션 | 비용 | 일관성 |
      |------|------|--------|
      | **재사용** (call_judge + 도메인 프롬프트) | 낮음 | 강함 (4-axes 같은 패턴 공유) |
      | **자체 judge** (각 하네스) | 높음 | 약함 |

      **해제 영향**: Phase 6 (인터뷰) 출시 전 결정 필요.

  - title: "Q10 — 프로세스: 단일 PR vs N개 PR"
    body: |
      **출처**: `11-migration-phases.html`.

      **질문**: 본 통합안을 단일 설계 PR로 출시하고 Phase 0–7을 각각 별도
      구현 PR로 출시할 것인가? 아니면 Phase 0 (포터빌리티) + Phase 1
      (LCS)만 자체 PR로 출시하고 나머지는 나중에 분리?

      **해제 영향**: 출시 일정.

  - title: 결정 잠금 해제 매트릭스
    body: |
      | 질문 | 잠긴 결정 | 잠금 해제 시 영향 |
      |------|----------|-------------------|
      | Q1 | 결정 7 | Phase 5 출시 시점 |
      | Q2 | 결정 6 | verification 게이트 구현 복잡도 |
      | Q3 | 결정 8 | Phase 0 비용, Phase 1 결정 8 보장 |
      | Q4 | 결정 8 | 런타임 감지 정책 |
      | Q5 | 결정 1 (잠금 유지 후보) | 별도 트랙 가능 |
      | Q6 | 결정 2 (잠금 유지 후보) | 자기 개선 가능 산출물 경계 |
      | Q7 | 결정 8 (확장) | LCS 응답 스키마 |
      | Q8 | 결정 8 (CI) | CI 비용 |
      | Q9 | (인프라) | LLM judge 공유 범위 |
      | Q10 | (프로세스) | 출시 일정 |
      | Q8 | 결정 8 (CI) | CI 비용 |
      | Q9 | (프로세스) | 출시 일정 |

  - title: Related
    body: |
