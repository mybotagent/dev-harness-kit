title: "11 — 마이그레이션 단계 (Phase 0–7)"
status: design-discussion
issue: 280
date: 2026-07-21
tags: [migration, phases, release-order]
sections:
  - title: 정의
    body: |
      8개 Phase의 출시 순서. 각 Phase는 **PR 1건**이며, **독립적으로
      출시 + 리뷰 + revert 가능**. 이전 Phase가 출시될 것을 요구하는
      Phase는 없다.

      ```
      Phase 0 (포터빌리티) — 모든 Phase의 선결 조건
        ↓
      Phase 1 (LCS)
        ↓
      Phase 2 (훅이 LCS 읽기)
        ↓
      Phase 3 (평가 확장)
        ↓
      Phase 4 (플랜 가치)
        ↓
      Phase 5 (리서치 강화)
        ↓
      Phase 6 (인터뷰)
        ↓
      Phase 7 (하네스 감사)
      ```

      **위험 낮은 순서**. 결정 4·6·7의 강제 영역을 먼저. 추론 비중
      큰 Phase 6은 **마지막**.

  - title: Phase 0 — 포터빌리티 (선결 조건)
    body: |
      **출시**:
      - `lib/runtime_adapters/{base,tokens,sessions,hooks,user_input,workspace,skill_install,claude_code,codex}.py`
      - `tests/test_portability.py`
      - `.github/workflows/test-portability.yml`
      - `docs/architecture/RUNTIME-PORTABILITY.md`

      **위험**: 매우 낮음 (인터페이스 + 결정적 테스트).
      **결정 8 영향**: 결정 8의 1차 alpha.
      **자체의 port 검증**: 양 런타임 인터페이스 구현으로 결정 8 자체 검증.

      **선결 조건**: Phase 0 없이 다른 Phase PR은 차단.

  - title: Phase 1 — LCS
    body: |
      **출시**:
      - `lib/lcs_server.py`
      - `bin/dev-kit-lcs.py`
      - `lib/lcs_resources/{__init__,worktrees,pr,spend,hooks_coverage,branches,sessions,interview,research_cache}.py`
      - `skills/lcs/SKILL.md`
      - `tests/test_lcs_server.py` + `tests/test_lcs_resources.py`
      - `tests/test_smoke.py` (SKILL_COUNT 35 → 36)

      **위험**: 매우 낮음 (실제 I/O).
      **Phase 0 의존**: 토큰 / 세션 어댑터 경유.
      **차용**: 없음 (이 저장소 자체의 원래 #280 작업).

  - title: Phase 2 — 훅이 LCS 읽기
    body: |
      **출시**:
      - `hooks/worktree-guard.sh` (LCS 전환)
      - `hooks/git-guard.sh` (LCS 전환)
      - `tests/test_lcs_hook_integration.py`

      **위험**: 매우 낮음 (결정적).
      **Phase 0 의존**: hooks 어댑터로 이벤트 이름 정규화.
      **셸아웃 폴백**: LCS 불가 시 기존 로직으로 fall through (백워드
      호환).

  - title: Phase 3 — 평가 확장
    body: |
      **출시**:
      - `lib/eval_runner.py` (RUBRIC_REGISTRY 확장)
      - `lib/analysis-core/cross_validate.py` (신규)
      - `skills/evaluate/SKILL.md` (alpha: enforcement)
      - `eval/rubrics/{harness-quality,os-quality}.yaml`
      - `tests/test_evaluate_extended.py` + `tests/test_evaluation_rubrics.py`
      - `tests/test_smoke.py` (SKILL_COUNT 36 → 37)

      **위험**: 낮음 (명시적 루브릭).
      **Phase 0 의존**: 어댑터 불필요 (자동 중립).
      **차용**: AEGIS Digester 패턴.

  - title: Phase 4 — 플랜 가치
    body: |
      **출시**:
      - `lib/valuation_engine.py`
      - `lib/valuation_rubrics/default.yaml`
      - `skills/valuate/SKILL.md` (alpha: enforcement)
      - `docs/stages/STAGES.md` ("valuate" 단계 행)
      - `skills/build/SKILL.md` (no-go 게이트)
      - `tests/test_valuation_engine.py`
      - `tests/test_smoke.py` (SKILL_COUNT 37 → 38)

      **위험**: 낮음 (규칙 기반).
      **Phase 0 의존**: 어댑터 불필요 (자동 중립).
      **차용**: AEGIS Critic + verification 게이트.
      **결정 6 영향**: `no-go` 게이트 = verification 게이트 잠금의
      첫 구현.

  - title: Phase 5 — 리서치 강화
    body: |
      **출시**:
      - `lib/research_engine.py`
      - `skills/research/SKILL.md` (alpha: enforcement)
      - `tests/test_research_engine.py`
      - `tests/test_smoke.py` (SKILL_COUNT 38 → 39)

      **위험**: 낮음 (실제 I/O + 명시적 인용).
      **Phase 0 의존**: 어댑터 불필요.
      **차용**: insane-search의 Phase 0–3 에스컬레이션.
      **결정 5·6·7**: 인용 강제 + verification 게이트 + 4단계 잠금의
      종합 구현.

  - title: Phase 6 — 인터뷰
    body: |
      **출시**:
      - `lib/interview_engine.py` — plan skill의 5-field 안전 계약 구현
        (`safety_valve=8`, `composite convergence: ambiguity_score <= 3 AND value_score >= 3.0`,
        `narrowed_delta`, `dedup_metric: identical-ambiguity-cycle=2`, `user_interrupt`)
      - `lib/interview_rubrics/default.yaml`
      - `skills/interview/SKILL.md` (alpha: state) — frontmatter에 5-field 안전 계약 선언
      - `skills/plan/SKILL.md` (인터뷰 출력 소비)
      - `tests/test_interview_engine.py` — `narrowed_delta`/`dedup_metric` 회귀
      - `tests/test_smoke.py` (SKILL_COUNT 39 → 40)

      **위험**: **중간** (기존 plan 패턴이 검증됨 → 재발명 위험만 큼지 않음).
      질문 표현 자체는 여전히 추론 비중이지만 점수 채점은 결정적
      임계값 + dedup_metric로 게이트됨.
      **Phase 0 의존**: 사용자 입력 어댑터 (`user_input.py`).
      **결정 1·2 적용**: 자동 평가 / 자가 평가 기각. LLM judge 채점은
      `lib/llm_judge.py`의 multi-judge variance gate 패턴으로 강제 (v1은
      단일 judge + dedup_metric, v2에서 적대 judge).

  - title: Phase 7 — 하네스 감사
    body: |
      **출시**:
      - `skills/harness-audit/SKILL.md` (alpha: analysis)
      - `tools/harness_audit.py`
      - `tests/test_harness_audit.py`
      - `tests/test_smoke.py` (SKILL_COUNT 40 → 41)

      **위험**: 분석 (낮은 추론 의존).
      **Phase 0 의존**: 어댑터 불필요.
      **self-improvement 잠금**: 감사는 read-only; 어떤 상태도 쓰지
      않음. 자기 평가로 변질되지 않도록 enforcement가 아닌 analysis.

  - title: 합계 (8 PR, 7+1)
    body: |
      | Phase | 위험 | SKILL_COUNT | 신규 LOC (대략) |
      |-------|------|------------|----------------|
      | 0 포터빌리티 | 매우 낮음 | (변동 없음) | ~500 |
      | 1 LCS | 매우 낮음 | 35 → 36 | ~600 |
      | 2 훅 → LCS | 매우 낮음 | (변동 없음) | ~100 (셸 수정) |
      | 3 평가 확장 | 낮음 | 36 → 37 | ~400 |
      | 4 플랜 가치 | 낮음 | 37 → 38 | ~300 |
      | 5 리서치 강화 | 낮음 | 38 → 39 | ~400 |
      | 6 인터뷰 | **높음** | 39 → 40 | ~400 |
      | 7 하네스 감사 | 분석 | 40 → 41 | ~200 |

      **합계**: 8 PR, ~2,900 LOC 신규 + 기존 10개 파일 확장.
      **재작성 없음**.

  - title: Backward compatibility (재진입 안전망)
    body: |
      모든 신규 동작은 opt-out:

      - `/dev-kit:plan` — `--skip-interview` (영구 플래그)
      - `/dev-kit:build` — `--skip-valuation` (영구 플래그)
      - `/dev-kit:eval` — 신규 차원 opt-in 플래그
      - Hooks — LCS 불가 시 셸아웃 폴백

      모든 신규 PR은 **하위 호환** 유지. 기존 사용자의 워크플로 변경 없음.

  - title: Related
    body: |
      - `10-decision-record.html`: 각 Phase가 잠그는 결정
      - `09-consolidated-architecture.html`: Phase가 출시하는 표면의 통합 맥락
      - `12-open-questions.html`: Phase별 컨센서스 미결 질문