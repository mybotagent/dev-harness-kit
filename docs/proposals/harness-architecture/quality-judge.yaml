title: "04 — 평가 하네스 (품질 심사)"
status: design-discussion
issue: 280
date: 2026-07-21
tags: [evaluation, quality, rubric, l7, adversarial]
sections:
  - title: 정의
    body: |
      **평가 하네스**는 AI 산출물의 품질을 **다차원 루브릭**으로 채점한다.
      평가 대상은 세 가지다:
      1. **AI 답변 품질** — 에이전트가 사용자에게 돌려준 답이 정확한가,
        완전한가, 명료한가, 근거가 충분한가?
      2. **하네스 자체의 품질** — MCP, LCS, 인터뷰, 플랜 가치, 리서치
        하네스가 잘 작동하는가? 버그, 격리, 관측 가능성?
      3. **AI 에이전트 OS 시스템의 품질** — 권한 분리, 비용 가시성,
        롤백 가능성, 에스컬레이션 경로?

      각 점수는 단순한 숫자가 아니라 **왜 그 점수인지의 근거**를
      가져야 한다. 적대적 다중 판사 패턴을 따른다.

  - title: AI 답변 품질 루브릭 (5차원)
    body: |
      | 차원 | 1–5점 정의 |
      |------|----------|
      | **정확성** | 사실 관계 오류가 있는가? |
      | **완전성** | 사용자가 필요로 하는 모든 측면을 다루었는가? |
      | **명료성** | 한 번 읽고 이해할 수 있는가? |
      | **근거** | 주장에 출처와 이유가 있는가? |
      | **실행 가능성** | 답을 받은 사용자가 다음 행동을 취할 수 있는가? |

  - title: 하네스 품질 루브릭 (4차원)
    body: |
      | 차원 | 정의 |
      |------|------|
      | **결정성** | 같은 입력에 같은 출력을 보장하는가? |
      | **격리** | 한 실패가 다른 기능에 영향을 주는가? |
      | **관측 가능성** | 내부 상태를 외부에서 볼 수 있는가? |
      | **테스트 가능성** | 단위 테스트로 검증할 수 있는가? |

  - title: AI 에이전트 OS 품질 루브릭 (4차원)
    body: |
      | 차원 | 정의 |
      |------|------|
      | **권한 분리** | 불필요한 권한이 부여되지 않았는가? |
      | **비용 가시성** | 토큰/USD 사용이 추적되는가? |
      | **롤백 가능성** | 실패 시 이전 상태로 돌아갈 수 있는가? |
      | **에스컬레이션 경로** | 실패 시 사람의 개입 경로가 있는가? |

  - title: 적대적 교차검증 (의사결정 핵심)
    body: |
      **한 판사의 채점은 점수가 아니다** — N개 판사가 독립 채점 후
      합의점수 + 비합의 표시.

      ```
        산출물 → N개 판사 팬아웃 (N≥3, 기본 3) →
        각 판사 점수 + 근거 →
        합의: 평균 or 중앙값 + 분산 →
        분산 > 임계값: 추가 판사 소집 (variance gate) →
        최종 점수 + 권고 개선
      ```

      **분산 게이트**는 적대적 검증의 핵심 — 한 명이 "정확성 5", 다른
      한 명이 "정확성 3, 이유 X"이면 **무조건 에스컬레이션**. 단순
      다수결이 아니다.

  - title: 자가 평가 금지 (결정 2)
    body: |
      결정 2: **자가 평가 = 기각**. 어떤 하네스도 자기 산출물을
      자기 채점하지 않는다. Evaluation 하네스의 **다중 판사만** 점수
      발행.

      적용:
      - 인터뷰 엔진이 자기 답변을 채점하지 않음
      - 리서치 엔진이 자기 종합을 채점하지 않음
      - 플랜 가치 엔진이 자기 결정의 가치를 채점하지 않음
      - LCS는 데이터 보유만 — 채점 없음

      심지어 Evaluation 하네스 자체도 **다른 Evaluation 호출로** 채점.
      자기 점수는 동일하지 않음.

  - title: 흡수 위험 (L7)
    body: |
      | 컴포넌트 | 위험 | 비고 |
      |----------|------|------|
      | **루브릭 정의** | 낮음 | 명시적 YAML; 포맷 고정 |
      | **점수 채점** (모델이 점수 매기는 행위) | **중간** — 부분 흡수 가능 | **얇게**: 모델이 점수 *제안*, 게이트가 검증; 적대적 교차검증 강제 |
      | **적대적 교차검증** | 낮음 | N 독립 판사 — 포맷 고정 |
      | **루브릭 버전 관리** | 낮음 | YAML git 추적 |
      | **리포트 렌더링** | 매우 낮음 | `lib/render_report_html.py` 재사용 |

      **결정적 강제 영역**: 적대적 교차검증, 자가 평가 금지, 점수의
      근거 강제. 모델이 흡수할 수 없는 부분.

  - title: 런타임 중립성 (결정 8)
    body: |
      - 평가 엔진 (`lib/eval_runner.py`): 순수 함수 → 자동 중립
      - 루브릭 YAML: 데이터 → 자동 중립
      - N개 판사 팬아웃: `tools/parallel_dispatch.py` 추상화 → 자동 중립
      - 리포트 렌더링: `lib/render_report_html.py` 재사용 → 자동 중립

      **어댑터 불필요**. 결정 8 영향 없음.

  - title: 인터페이스 (의사)
    body: |
      ```python
      # lib/eval_runner.py (확장)
      class RubricRegistry:
          def register(self, name: str, dimensions: list[Dimension]) -> None: ...
          def lookup(self, name: str, version: str = "current") -> Rubric: ...

      def evaluate(artifact: Artifact,
                   rubric: Rubric,
                   n_judges: int = 3) -> EvaluationResult:
          # fan-out to N judges, collect, variance check, return
      ```

