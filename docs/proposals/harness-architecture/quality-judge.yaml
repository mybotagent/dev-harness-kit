    body: |
      - `05-value-gate.html` — 플랜 가치 평가는 Evaluation의 별도 인스턴스
      - `06-external-verifier.html` — 리서치 verification 게이트가 Evaluation 패턴 차용
      - `09-consolidated-architecture.html` — alpha 회계
      - `08-external-references.html` — AEGIS Digester 패턴 차용
      - `10-decision-record.html` — 결정 2 (자가 평가 금지), 결정 6 (verification 게이트)
      - `11-migration-phases.html` — Phase 3
      - `03-ambiguity-resolver.html` — 동일 패턴 (LLM judge + variance gate + status semantics `ok`/`held`)
