tags: [langfuse, observability, eval, superseded, governance]
sections:
  - title: 결정
    body: |
      GitHub issue #509 (2026-07-31 분석)에 따라 **Langfuse 도입 보류**.
      상세 사유는 issue 본문 참조.

  - title: Superseded 파일 목록
    body: |
      본 디렉토리의 `01-pros-and-cons.yaml` ~ `04-what-is-langfuse.yaml`은
      원래 Langfuse 도입을 권고하던 proposal이었으나, 본 결정으로 모두
      `superseded` 상태로 전환됨. 다음 항목만 reference로 보존:

      - `05-overengineering-check.yaml` — 비용/효용 분석
      - `06-api-mode-revisit.yaml` — API only 환경 재평가
      - `07-agent-behavior-rubric.yaml` — **즉시 채택** (Langfuse 무관)
      - `08-rubric-improvements.yaml` — 07 루브릭 개선 로드맵

  - title: 재평가 트리거 (분기별 점검)
    body: |
      다음 조건 중 **하나라도** 해당되면 본 proposal을 재평가:

      - eval case 수 > 50
      - 팀 > 5 contributors
      - API spend > $1k/mo
      - multi-tenant eval infra 필요
      - production telemetry ↔ eval correlation 필요
      - human feedback aggregation 요구
