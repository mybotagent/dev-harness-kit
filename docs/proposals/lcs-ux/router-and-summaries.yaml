title: 'LCS UX: NL router, summary dimension, and discovery endpoints'
status: design-discussion
issue: 455
date: 2026-07-29
tags:
- lcs
- ux
- router
- summaries
- discovery
- l7
sections:
- title: TL;DR
  body: "LCS today answers correctly but answers **badly**. Three concrete\ngaps surfaced during a routine operator session\
    \ on 2026-07-28:\n\n1. The no-arg invocation (`/dev-kit:lcs`) lands on\n   `lcs://worktrees` and dumps 89 KB of JSON for\
    \ 14 entries --\n   no summary, no staleness signal, the operator has to eyeball\n   14 timestamps to notice that 13 of\
    \ those worktrees are\n   zombies on slot `0.3.100` while main is at `0.3.150`.\n2. The handler set answers one-record\
    \ questions\n   (`lcs://branches/<name>`, `lcs://sessions/<id>`,\n   `lcs://pr/<n>`) but provides **no discovery endpoint**\
    \ for\n   any of them -- to call `lcs://sessions/<id>` you must already\n   know the UUID, and the canonical index\n \
    \  (`logs/sessions/<id>.json`) is empty until a separate dumper\n   runs.\n3. Three URIs are documented in the SKILL.md\
    \ body\n   (`lcs://hooks/coverage`, `lcs://interview/<step>`,\n   `lcs://research/cache`) but are **not registered** in\n\
    \   `bin/dev-kit-lcs.py`. They return exit 2 -- a documented\n   feature that is not a feature.\n\nThe fix is three small\
    \ additions that turn LCS from\n*\"a per-record fetcher you must already know how to drive\"*\ninto *\"a state surface\
    \ that earns its keep on aggregate\nquestions and stays honest about freshness.\"*\n"
- title: Gap 1 -- NL router with a break-even rule
  body: '**Observation.** When an operator types

    "what worktrees are stale?" or "what branch am I on?",

    neither question currently routes through LCS -- the operator

    shells out to `git worktree list` or `git branch --show-current`.

    The friction is not the LCS call itself (one CLI invocation);

    the friction is that the operator has to *already know* the

    URI shape.


    **Proposal.** Add a thin NL-to-URI router that fires only when

    the question maps to a *multi-source aggregation no single

    shell call produces*. Direct shell always wins when it can

    answer in one call.


    | Operator question | Single shell call? | Router action |

    |---|---|---|

    | "what branch am I on?" | yes (`git branch --show-current`) | **shell** |

    | "what worktrees are stale?" | no (needs `git worktree list` + per-tree age + per-tree slot) | `lcs://worktrees` |

    | "what''s the slot version on branch X?" | partial (needs path resolution + `cat plugin.json`) | `lcs://branches/<name>/slot`
    |

    | "what''s PR #N''s CI + slot?" | no (needs `gh pr checks` + `gh run view` + slot cross-ref) | `lcs://pr/<n>` |

    | "token spend per worktree last 24h?" | no (walk `logs/**/*.jsonl` + parse + bucket) | `lcs://spend/24h` |

    | "what session is doing X?" | no (must scan runtime transcripts) | `lcs://sessions/<id>` |


    **Break-even rule** (encoded in the router, not the operator):


    > If a single shell call answers the question, use the shell.

    > If it requires N correlated calls across heterogeneous

    > sources, route to LCS.


    **Cost concern.** The dispatcher adds classifier + parse +

    render overhead -- ~200 tokens per routed call. This is only

    acceptable when LCS''s aggregated answer replaces *N*

    correlated shell calls (each ~50-200 tokens). Net: positive

    ROI on multi-source aggregations, negative ROI on

    one-tool questions. The router is the gate.


    **Scope.** Router lives as a thin pre-LCS layer in

    `bin/dev-kit-lcs.py` (or as a sibling `bin/dev-kit-lcs-route.py`).

    It is **not** a skill -- a skill that decides whether to call

    another skill is L6 anti-pattern (state-less reasoning surface

    that next-gen models absorb). The router is a deterministic

    classifier + URI lookup table.

    '
- title: Gap 2 -- summary + staleness dimension on aggregations
  body: "**Observation.** `lcs://worktrees` returns 14 entries with\nper-row `last_touched` and `slot_version`, but no aggregated\n\
    staleness signal. An operator reading\n`{worktrees: [14 entries]}` assumes 14 active worktrees. In\nreality: 1 active,\
    \ 13 zombie slots parked on\n`slot_version: 0.3.100` since July 21, while main is at\n`0.3.150` (50 versions behind).\n\
    \nThe aggregation **misleads by precision**. The shape says\n`status: ok` and the operator trusts it.\n\n**Proposal.**\
    \ Add a `summary` block alongside the per-record\nlist on every aggregation resource. Surface freshness\ndimensions the\
    \ operator cannot infer by eyeballing per-row\ntimestamps.\n\n```yaml\ndata:\n  worktrees:\n    - { branch: main, ...,\
    \ last_touched: 2026-07-28T14:49, slot_version: 0.3.150 }\n    - { branch: worktree-agent-..., ..., last_touched: 2026-07-21T05:18,\
    \ slot_version: 0.3.100 }\n  summary:\n    total: 14\n    active: 1       # last_touched < 24h\n    stale: 13       #\
    \ last_touched > 24h\n    slot_drift:\n      min: 0.3.100\n      max: 0.3.150\n      behind_count: 13\n    as_of: 2026-07-29T...\n\
    ```\n\n**Why this matters.** Without `summary`, an aggregation of\n14 stale records is operationally indistinguishable\
    \ from an\naggregation of 14 active ones. The shape lies by being\ntechnically correct. With `summary`, the operator sees\n\
    `active: 1, stale: 13` and prunes; with `slot_drift`, they\nsee the version gap and know what bumping buys them.\n\n**Same\
    \ treatment for other aggregations.** `lcs://branches`\n(list, if added) carries `summary.local_only: N`,\n`summary.ahead_of_origin:\
    \ N`, etc. `lcs://spend/<window>`\nalready aggregates but should add `summary.by_worktree: {...}`\nso the operator sees\
    \ \"13 zombie worktrees spent 0 tokens last\n24h\" without doing the join by hand.\n\n**Freshness contract.** `summary.as_of`\
    \ is mandatory on every\naggregation. The skill body should state this contract:\n*\"Every aggregation surfaces when it\
    \ was assembled.\nPer-row fields reflect call-time state, but `summary` is\nwhat an operator reads first.\"*\n"
- title: Gap 3 -- discovery endpoints for id-keyed resources
  body: "**Observation.** Three handlers require a parameter that the\noperator cannot discover from LCS itself:\n\n- `lcs://branches/<name>`\
    \ -- no `lcs://branches` (list).\n- `lcs://sessions/<id>` -- no `lcs://sessions` (list); canonical\n  index (`logs/sessions/<id>.json`)\
    \ is empty.\n- `lcs://pr/<n>` -- no `lcs://prs` (list); operator must `gh pr list`\n  first to learn `n`.\n\n**Proposal.**\
    \ Add a **list variant** for each id-keyed\nresource, returning a small summary-shaped response (not the\nfull per-record\
    \ payload):\n\n| URI | Returns |\n|---|---|\n| `lcs://branches` | `{branches: [{name, local_head, ahead, behind, last_ci_conclusion}],\
    \ summary: {...}}` |\n| `lcs://sessions` | `{sessions: [{id, role, started_at, current_task, last_tool}], summary: {total,\
    \ by_role}}` |\n| `lcs://prs` | `{prs: [{n, title, head, ci_state, review_state}], summary: {...}}` |\n\nDiscovery calls\
    \ are cheap (no per-record detail), let the\noperator pick a row, then drill in with the\nid-keyed variant for the full\
    \ payload.\n\n**Empty-index failure mode.** `lcs://sessions` returns\n`summary.total: 0` when no canonical dumps exist.\
    \ That's an\nhonest signal -- *no sessions indexed* -- not an error. The\nskill body should call this out: list calls\
    \ return empty +\nsummary rather than `partial` when the index simply hasn't\nbeen populated. (Existing `LCSPartialError`\
    \ semantics stay\nreserved for *partial info on a real record*.)\n"
- title: Gap 4 -- the documented-but-unwired URI trap
  body: "**Observation.** The SKILL.md body advertises\n`lcs://hooks/coverage`, `lcs://interview/<step>`, and\n`lcs://research/cache`.\
    \ None are registered in\n`bin/dev-kit-lcs.py`. All return exit 2.\n\nA documented URI that is not a registered route\
    \ is worse\nthan no URI: the operator reads the SKILL.md, types the URI,\ngets exit 2, and concludes LCS is broken. The\
    \ contract lies.\n\n**Proposal.** Two changes:\n\n1. **Document only registered routes.** Move\n   `hooks/coverage`, `interview`,\
    \ `research/cache` from the\n   main URI table to a \"reserved (planned)\" footnote with an\n   explicit `status: not-registered`\
    \ field. Operators reading\n   the table know which URIs are real.\n\n2. **Add a `--list-routes` flag** (or extend\n \
    \  `--list-resources`) that prints the registered-vs-reserved\n   split from the CLI:\n\n   ```\n   $ python3 bin/dev-kit-lcs.py\
    \ --list-routes\n   registered:\n     lcs://worktrees                       worktrees\n     lcs://branches/<name>    \
    \             branches\n     ...\n   reserved (not implemented):\n     lcs://hooks/coverage\n     lcs://interview/<step>\n\
    \     lcs://research/cache\n   ```\n\n   Reserved routes never lie about being callable; they\n   advertise themselves\
    \ as planned.\n\nThis is a doc + CLI flag change, not a code change. No new\nhandlers.\n"
- title: When to not use LCS
  body: "LCS is not the right tool for every state question. The\nproposal explicitly carves out the cases where direct shell\n\
    is faster, cheaper, and clearer:\n\n- **One-tool questions.** \"what branch am I on?\",\n  \"is the working tree dirty?\"\
    , \"what's HEAD's SHA?\" --\n  a single `git` call answers in <50 tokens. Routing through\n  LCS wastes 200+ tokens of\
    \ classifier + parse overhead.\n- **Trivial reads.** `cat package.json`, `ls .worktrees/`,\n  `gh pr view` for the current\
    \ branch's PR -- these are\n  already one call each and don't need a stable contract\n  because no automation consumes\
    \ them.\n- **Operator conversation Q&A.** \"is there a PR open?\",\n  \"did the version bump pass?\" -- the operator wants\
    \ a\n  yes/no and a sentence, not a JSON envelope. Direct\n  tool calls + a one-line summary beat the LCS round-trip.\n\
    \nLCS earns its keep when **the question requires N correlated\ncalls across heterogeneous sources**, OR **automation\n\
    downstream needs a stable JSON contract**. The router in\nGap 1 encodes this rule; the SKILL.md should say so plainly.\n"
- title: Acceptance criteria
  body: "- [ ] `lcs://worktrees`, `lcs://branches` (list),\n      `lcs://sessions` (list), `lcs://prs` (list) each\n     \
    \ return a `summary` block with `as_of`, freshness\n      dimensions, and slot/version drift where applicable.\n- [ ]\
    \ NL-to-URI router added as `bin/dev-kit-lcs-route.py`\n      (or sibling module) with the break-even rule\n      documented\
    \ in the module docstring and tested.\n- [ ] SKILL.md URI table marks reserved URIs explicitly;\n      `bin/dev-kit-lcs.py\
    \ --list-routes` prints\n      `registered` vs `reserved (not implemented)`.\n- [ ] `lcs://branches` (list), `lcs://sessions`\
    \ (list),\n      `lcs://prs` (list) registered and return\n      summary-shaped responses (small payload, not the\n  \
    \    full per-record detail).\n- [ ] Tests for: `summary` block presence on every\n      aggregation; router break-even\
    \ table; empty-index\n      list returns `summary.total: 0`, not `partial`.\n- [ ] No regression in existing handlers'\n\
    \      `status: \"ok\"` envelopes (additive change only).\n"
- title: Out of scope
  body: "- **Caching/TTL policy.** The proposal does not touch the\n  5-second in-memory snapshot TTL. Aggregation freshness\n\
    \  (`summary.as_of`) makes the staleness visible; it does\n  not shorten it. A separate proposal can address TTL\n  semantics\
    \ if needed.\n- **MCP transport.** This proposal is CLI-only.\n  `lcs://...` over MCP is a separate surface with its own\n\
    \  UX problems (notification protocol, capability\n  advertisement) and deserves its own proposal.\n- **New handlers.**\
    \ The proposal adds discovery + summary\n  dimensions to *existing* handlers; it does not add\n  `lcs://hooks/coverage`\
    \ etc. Those are reserved until a\n  separate proposal implements them.\n- **Authn/authz on `gh` calls.** The branches\
    \ handler\n  calls `gh run list` per branch. Auth gating is a\n  separate concern.\n"
- title: Related
  body: "- `docs/proposals/harness-architecture/live-context-server.html`\n  -- the parent LCS proposal (issue #280). This\
    \ proposal\n  amends the UX surface; the handler set and URI contract\n  are unchanged.\n- `skills/lcs/SKILL.md` -- the\
    \ operator-facing surface that\n  must reflect Gap 1 (router) and Gap 4 (reserved-URI\n  honesty).\n- `bin/dev-kit-lcs.py`\
    \ -- the CLI driver that gains\n  `--list-routes` and the optional `--route <question>`\n  mode.\n- `lib/lcs_resources/*.py`\
    \ -- six production handlers; each\n  aggregation resource (`worktrees`, future\n  `branches`/`sessions`/`prs`) gains\
    \ a `summary` block.\n- `tools/token_efficiency_analyzer.py` -- the\n  router's break-even rule is *exactly* the kind\
    \ of\n  \"model mismatch / overspec\" anti-pattern the analyzer\n  surfaces. Treat the router's ROI table as a regression\n\
    \  check: any future \"let's route everything through LCS\"\n  enthusiasm should fail because the analyzer flags the\n\
    \  regression.\n"
- title: Next step
  body: "1. Open a GitHub issue referencing this proposal (see\n   `issue: TBD` in the frontmatter -- fill in once the issue\n\
    \   number is known).\n2. Cut a build worktree off `origin/main` and route through\n   `/dev-kit:plan` to produce phases\
    \ for Gaps 1-4.\n3. Land `summary` blocks first (additive, no behavior\n   change, small blast radius). Router second.\
    \ Reserved-URI\n   doc honesty third. Discovery endpoints last.\n4. After each phase lands, run\n   `/dev-kit:token-analyzer`\
    \ to confirm the router's\n   break-even rule is empirically holding (multi-source\n   questions route to LCS; single-shell\
    \ questions don't).\n"
