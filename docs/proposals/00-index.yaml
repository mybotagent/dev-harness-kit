title: 멀티 하네스 시스템 — Issue #280 설계 제안 색인
status: design-discussion
issue: 280
date: 2026-07-21
tags: [mcp, lcs, harness, interview, evaluation, research, integration, dev-harness-kit, index]
sections:
  - title: Overview (이 디렉터리를 어떻게 읽을 것인가)
    body: |
      이 디렉터리는 issue **#280**을 종료하기 위한 설계 제안을 **13개의
      주제별 파일**로 재구성한 것이다. 각 파일은 하나의 주제를 다루며
      서로 상호 참조한다.

      **읽는 순서** (3가지 경로):

      - **빠른 이해 (20분)**: [01 — MCP](01-protocol-layer.html) → [02 — LCS](02-live-context-server.html) → [09 — 통합](09-consolidated-architecture.html) → [10 — 결정](10-decision-record.html) → [11 — 마이그레이션](11-migration-phases.html)
      - **구현 준비 (60분)**: 전부 + [12 — 공개 질문](12-open-questions.html)
      - **특정 주제 진입**: 아래 색인에서 파일 선택

      **핵심 빌드 원칙**: 차세대 모델이 흡수하지 못하는 부분에 alpha를
      투입한다. 자세한 분류는 [09 — 통합 아키텍처](09-consolidated-architecture.html)
      (alpha 회계) 참조.

  - title: 색인 (12개 주제 파일)
    body: |
      | # | 파일 | 주제 | 핵심 질문 |
      |---|------|------|-----------|
      | 01 | [01-protocol-layer.html](01-protocol-layer.html) | MCP 와이어 프로토콜 | 런타임이 외부 서버와 어떻게 대화하는가 |
      | 02 | [02-live-context-server.html](02-live-context-server.html) | LCS — 상태 리더 | 에이전트가 git/gh에 셸아웃하는 것을 어떻게 멈추게 하는가 |
      | 03 | [03-ambiguity-resolver.html](03-ambiguity-resolver.html) | 인터뷰 하네스 | 구현 전 플랜 모호함을 어떻게 해소하는가 |
      | 04 | [04-quality-judge.html](04-quality-judge.html) | 평가 하네스 | AI 산출물 품질을 어떻게 다차원 채점하는가 |
      | 05 | [05-value-gate.html](05-value-gate.html) | 플랜 가치 평가 | 인터뷰 완료 플랜의 구현 가치를 어떻게 판단하는가 |
      | 06 | [06-external-verifier.html](06-external-verifier.html) | 리서치 하네스 (Phase 0–3 에스컬레이션) | 플랜을 외부 자료로 어떻게 검증하는가 |
      | 07 | [07-runtime-portability.html](07-runtime-portability.html) | 런타임 중립성 (결정 8) | Claude Code + Codex 양쪽에서 어떻게 동등 동작하는가 |
      | 08 | [08-external-references.html](08-external-references.html) | 외부 참조 비판 | insane-search / hermes / AEGIS에서 무엇을 차용하고 기각하는가 |
      | 09 | [09-consolidated-architecture.html](09-consolidated-architecture.html) | 통합 아키텍처 | 6개 하네스 + 어댑터 계층이 어떻게 맞물려 도는가 |
      | 10 | [10-decision-record.html](10-decision-record.html) | 결정 기록 (8개 잠금) | 왜 그 결정을 잠갔고, 무엇에 영향을 미치는가 |
      | 11 | [11-migration-phases.html](11-migration-phases.html) | 마이그레이션 단계 (Phase 0–7) | 어떤 PR이 어떤 순서로 출시되는가 |
      | 12 | [12-open-questions.html](12-open-questions.html) | 공개 질문 (#280 스레드) | 컨센서스가 필요한 결정은 무엇인가 |

  - title: 빌드 원칙 (4 위험 계층, L7 정렬)
    body: |
      | 위험 계층 | 흡수 위험 | 이 시스템의 예시 | alpha 배치 |
      |----------|----------|-----------------|------------|
      | 결정적 강제 (enforcement) | **매우 낮음** | 결정 8 어댑터, Phase 4·5 verification 게이트 | **집중** |
      | 외부 진실 (external truth) | **낮음** | LCS의 git/gh 읽기, 리서치의 1차 자료 | **집중** |
      | 상태 머신 (state machine) | **낮음** | 인터뷰 상태, build 단계 진행 | **집중** |
      | 추론 (reasoning) | **높음** | 모델이 자기 산출물 평가 | **기각** |

      "AI가 하네스를 먹는다"는 명제(AI Times, Brown / Kilpatrick)에
      따른 분류. 추론 비중이 큰 컴포넌트는 얇게 두고 verification
      게이트로 검증한다.

  - title: 외부 참조 (3개, 비판적 통합)
    body: |
      | 참조 | 차용 | 기각 |
      |------|------|------|
      | `fivetaku/insane-search` | Phase 0–3 에스컬레이션 로직, "인증 만나면 중단" 경계 | Claude `/plugin` 배포, 도구 실패 훅 트리거, host auto-install |
      | `nousresearch/hermes-agent` | 자기 개선 비전 (메모리 + 스킬) | 자가 평가 메커니즘 (외부 검증 부재) |
      | `HarnessX / AEGIS` (AI Times 2026-07-21) | Critic + verification 게이트 패턴 | 자동 하네스 코드 생성, Opus 메타 에이전트 의존, 내부 verification |

      상세: [08 — 외부 참조 비판](08-external-references.html).

  - title: 8개 잠금 결정 (요약)
    body: |
      | # | 결정 |
      |---|------|
      | 1 | 자동 코드 생성 = 기각 (L7) |
      | 2 | 자가 평가 = 기각 (외부 검증 부재) |
      | 3 | 벤더 종속 배포 = 기각 (표준 프로토콜 위배) |
      | 4 | Opus-class 메타 에이전트 = 기각 (L7 + 예산) |
      | 5 | 인용 강제 = 잠금 (리서치 정확성) |
      | 6 | verification 게이트 = 잠금 (외부 검증 강제) |
      | 7 | Phase 5 = 4단계 에스컬레이션 (insane-search 차용) |
      | 8 | **단일 런타임 종속 = 기각** (Claude Code + Codex 동등 동작 필수) |

      각 결정의 근거와 영향 범위: [10 — 결정 기록](10-decision-record.html).

  - title: 마이그레이션 단계 (요약)
    body: |
      **Phase 0 (포터빌리티)** — `lib/runtime_adapters/` + CI 매트릭스.
      모든 후속 Phase의 선결 조건.

      **Phase 1 (LCS)** — LCS 서버 + 8 리소스 + 스킬.

      **Phase 2 (훅이 LCS 읽기)** — worktree-guard, git-guard 전환.

      **Phase 3 (평가 확장)** — `lib/eval_runner.py` RUBRIC_REGISTRY
      + harness/OS 루브릭.

      **Phase 4 (플랜 가치)** — `lib/valuation_engine.py` + no-go 게이트.

      **Phase 5 (리서치 강화)** — `lib/research_engine.py` + Phase 0–3
      에스컬레이션 + 인용 verification.

      **Phase 6 (인터뷰)** — `lib/interview_engine.py` + plan 통합.

      **Phase 7 (하네스 감사)** — `skills/harness-audit/SKILL.md`.

      각 단계별 파일 diff + 위험: [11 — 마이그레이션 단계](11-migration-phases.html).

  - title: 공개 질문 (#280 스레드)
    body: |
      9개 질문이 컨센서스를 기다린다. 전체 목록과 어느 파일에서
      발생했는지: [12 — 공개 질문](12-open-questions.html).

      핵심 3개:
      - **결정 8 범위**: Phase 0에서 claude_code만 출시, codex는
        Phase 1과 동시 출시가 적절한가?
      - **Phase 5 단계 상한**: Phase 3 Playwright 비용이 큰데 v1에서
        Phase 0–1만 출시하고 Phase 2–3는 v2로 미룰 것인가?
      - **자동 코드 생성**: AEGIS Evolver 영감을 별도 이슈로 다룰
        의향이 있는가, 아니면 영구 차단인가?

  - title: Related (선행/저장소/이슈)
    body: |
      ### 선행 (현재 디렉터리에 통합됨 — 더 이상 별도 파일 없음)
      - 본 제안의 모든 사전 버전(7개 YAML+HTML)은 본 디렉터리 구조로
        통합되어 `docs/proposals/`에서 삭제됨.

      ### 저장소 내부
      - `docs/ACP-DISPATCH.md` — M/T/L 다중 에이전트 조정
      - `docs/acp-harness.md` — ACP 하네스 노트
      - `lib/analysis-core/` — 종합 엔진
      - `lib/render_report_html.py` + `bin/dev-kit-report.py` +
        `skills/report/SKILL.md` — 렌더 패턴 (재사용)
      - `tools/parallel_dispatch.py` — 팬아웃 프리미티브 (재사용)
      - `tools/token_efficiency_analyzer.py` — `lcs://spend` 데이터 소스
      - `lib/version-slot` — 슬롯 계산기
      - `hooks/worktree-guard.sh` — Phase 2에서 LCS 읽기로 전환
      - `lib/eval_runner.py` — Phase 3에서 RUBRIC_REGISTRY 확장
      - `.claude/settings.json` + `.codex/hooks.json` — Claude + Codex
        통합 설정 (결정 8 패턴의 기존 예시)

      ### 이슈
      - **Issue #280** — 이 제안이 종료함
