title: "03 — 인터뷰 하네스 (모호함 해소)"
status: design-discussion
issue: 280
date: 2026-07-21
tags: [interview, ambiguity, scoring, l7, llm-judge, plan-alignment]
sections:
  - title: 정의
    body: |
      **인터뷰 하네스**는 구현 전에 에이전트가 사용자 / 이해관계자에게
      **구조화된 질문**을 던져 **플랜 모호함**을 해소하는 루프다.
      모호함이 있는 플랜은 구현해도 의도와 어긋날 확률이 높다 —
      인터뷰는 그 어긋남을 사전에 잡는다.

      모호함 점수(LLM judge 채점)가 임계값 이하로 떨어지거나
      safety_valve 도달 시 종료.

      모호함이 해소된 플랜은 `lcs://interview/<session>`에 영속화되어
      다음 에이전트 / 다음 단계 (`04-quality-judge`의 평가 →
      `05-value-gate`의 가치 판단)가 읽는다.

  - title: 기존 plan 구현과의 정렬 (필수 일치)
    body: |
      인터뷰 하네스는 기존 `/dev-kit:plan` 스킬의 Gate 2/4 검증
      루프(=`skills/plan/SKILL.md` §2.3) 와 **동일한 JSON 형태 + 종료
      임계값**을 사용한다. **재발명 금지**, **패턴 차용**.

      ### 실제 JSON 형태 (eval transcript 인용)

      `eval/transcripts/plan/plan-01-clear-spec.json` (converged):
      ```json
      "validate": {
        "value_score": 4.2,
        "ambiguity_score": 2,
        "evidence_count": 3,
        "status": "ok"
      }
      ```

      `eval/transcripts/plan/plan-02-ambiguous-spec.json` (held):
      ```json
      "validate": {
        "value_score": 0.8,
        "ambiguity_score": 9,
        "evidence_count": 0,
        "status": "held"
      }
      ```
      노트: "ambiguity_score did not converge (still 9 after
      safety_valve=8 cycles on the same dimension)."

      `eval/transcripts/plan/plan-03-coupled-spec.json` (ok 경계):
      ```json
      "validate": {
        "value_score": 3.5,
        "ambiguity_score": 3,
        "evidence_count": 3,
        "status": "ok"
      }
      ```

      → **임계값 = 3** (3 이하 = `ok`, 그 이상 = `held` 가능성).

      ### 필드 정의 (plan 스킬 차용)
      | 필드 | 정의 | 임계값 |
      |------|------|--------|
      | `ambiguity_score` | LLM judge 채점 0–10 (낮을수록 좋음) | `<= 3` |
      | `value_score` | (LTV × reachable) / cost | `>= 3.0` |
      | `evidence_count` | 독립 출처 수 | `>= 3` |
      | `status` | `ok` \| `held` (safety_valve 소진) | 결정 |

      ### per-step ambiguity_delta
      `index.steps[].ambiguity_delta` — 각 step이 자체 모호함을 좁히는
      정도. plan-01/03 모두 0.0 (PRD 단계에서 이미 모호함 3 이하).

      ### 결정적 부분 vs 모델 위임
      | 결정적 (gate-verified) | 모델 위임 |
      |------------------------|-----------|
      | 임계값 (`<= 3`) | `ambiguity_score` 채점 자체 |
      | safety_valve=8 | 질문 문장 |
      | dedup_metric=2 | (재채점 시 모델 판단) |
      | status 결정 (`ok` vs `held`) | `value_score` 계산 |
      | knobs_covered 추적 | 답변 통합 |
      | 영속화 | — |

      **결정 2 (자가 평가 기각)**: 단일 모델의 채점이 아니라,
      interview loop에서는 `ambiguity_score`를 **동일 모델이 자기 자신을
      재채점**한다. 적대 judge를 추가하면 multi-judge fan-out으로 강화
      가능 (variance gate 패턴, `04-quality-judge.html`).

  - title: 점수 계산 — LLM Judge (self-rescore)
    body: |
      **모호함 점수는 LLM judge가 채점한다**. 키워드 매칭 / 규칙 기반
      점수 계산은 기각한다. 이유는 다음과 같다:

      - 모호함은 **의미적** 판단 (예: "트레이드오프가 충분히 명시화되었나?")
        이라서 결정적 함수로 표현 불가
      - LLM judge는 reasoning + 점수를 함께 출력 → **근거 강제 가능**
      - 다중 judge + 적대적 교차검증 (Evaluation과 동일 패턴)으로
        judge 편향을 차단

      ### 점수 채점 인터페이스 (의사)
      ```python
      # lib/interview_engine.py
      class AmbiguityJudge(Protocol):
          """LLM judge interface. Implementations are NOT deterministic."""
          def score(self,
                   plan: Plan,
                   history: list[QA],
                   knobs_covered: set[str]) -> tuple[int, str]:
              """Returns (score 0-10, reasoning). Lower = less ambiguous."""

      class AmbiguityRubric:
          """Concrete dimensions the judge scores on."""
          user: int         # 0-2 (0=clearly identified first user)
          pain: int         # 0-2 (0=clearly identified pain + frequency)
          scope: int        # 0-2 (0=smallest viable scope defined)
          metric: int       # 0-1 (0=success metric defined)
          kill: int         # 0-1 (0=kill criteria defined)
          contradiction: int  # 0-1 (0=no contradictions in history)
          unfilled: int     # 0-1 (0=no open questions remaining)
      ```

      ### 다중 judge + 적대적 검증
      ```
        1 judge → 1 score + reasoning
        → N=3 judges (적대적: 각 judge 다른 모델 또는 같은 모델 다른 seed)
        → 점수 평균 + 분산
        → 분산 > 임계값 → 추가 judge 소집 (variance gate)
        → 최종 점수
      ```

      분산 게이트는 Evaluation(`04-quality-judge.html`)과 동일 패턴.

  - title: 질문의 5가지 유형 + 1개 합성
    body: |
      5가지 표준 유형 + 사용자 의도 정량화 1개:

      | 유형 | 의도 | 영향 knob |
      |------|------|-----------|
      | **가정 확인** | 숨은 가정 명시화 | user (-1), unfilled (-1) |
      | **트레이드오프** | 의사결정 자료 명시화 | pain (-1), unfilled (-1) |
      | **스코프 경계** | 범위 명시화 | scope (-1), unfilled (-1) |
      | **사용자 의도** | 모호한 용어 정량화 | metric (-1) |
      | **위험 인정** | 트레이드오프 명시적 인정 | kill (-1), contradiction (-1) |
      | **합성 검증** | "위 답변들 사이 모순이 있나?" | contradiction (-1) |

      합성 검증은 1라운드 이후 매 답변 후 자동 실행. 모순 발견 시 다음
      라운드 우선순위로.

  - title: 메커니즘 — Ralph 스타일 루프
    body: |
      ```
        초기:
          ambiguity_score = 10
          knobs_covered = {}
          history = []
          decision_log.md → append "# interview start"

        ROUND loop (safety_valve=8):
          1. judge.score(plan, history, knobs_covered) → (score, reasoning)
          2. decision_log.md ← append {round, score, reasoning, knobs_covered}
          3. loop_log.json ← append {round, score, knobs_covered}

          4. if score <= THRESHOLD (3): BREAK ("converged")
          5. if score same as previous (narrowed_delta == 0):
               consecutive_same += 1
               if consecutive_same >= 2: BREAK ("best effort")
          6. if score > previous: ERROR (LLM judge inconsistent)

          7. knob = pick_highest_leverage_knob(score_breakdown, knobs_covered)
          8. question = generate_question(plan, knob)  # model-driven
          9. answer = prompt_user(question)            # adapter
          10. history.append((question, answer))
          11. knobs_covered.add(knob)
          12. plan = apply_answer(plan, answer)

        POST:
          lcs://interview/<session> ← {score, reasoning, knobs_covered, history}
          decision_log.md ← append "# interview end: status=<converged|best-effort>"
      ```

  - title: 종료 조건 — 결정적 임계값 + 안전장치
    body: |
      ### 1차 종료: 점수 임계값 도달 (PASS)
      ```
      PASS iff  ambiguity_score <= 3
                AND judge_variance < variance_threshold (0.5)
                AND knobs_covered >= {user, pain, scope, metric, kill}
                AND consecutive_contradictions == 0
      ```
      → status = `converged`. 플랜 가치 평가로 인계.

      ### 2차 종료: safety_valve (HELD)
      ```
      if rounds >= 8 OR consecutive_same_score >= 2:
        BREAK with status = "best-effort"
      ```
      → status = `best-effort`. 모호함 점수 + 미해결 knob 명시.
      플랜 가치 평가가 `hold` 결정 가능. 사용자에게 "best effort" 알림.

      ### 3차 종료: 사용자 명시 단축 (USER_DONE)
      ```
      if user_signoff == "충분하다" OR "더 묻지 말라":
        BREAK with status = "user-acknowledged"
      ```
      → status = `user-acknowledged`. 점수 임계값 무시.

      ### 4차 종료: 사용자 거부 (REJECTED)
      ```
      if user_signoff == "그만" OR 거부:
        BREAK with status = "rejected"
      ```
      → status = `rejected`. 플랜 가치 평가에 `kill` 위임.

      ### 우선순위
      1차 (점수) > 3차 (사용자 승인) > 2차 (safety_valve) > 4차 (거부)

      거부(4차)는 즉시 종료. 안전장치(2차)는 1차/3차 도달 못할 때만.

  - title: 'narrowed_delta 강제 (LLM judge 비결정성 보정)'
    body: |
      LLM judge는 비결정적이므로 **strictly decreasing score** 강제:

      ```
      for round in 1..safety_valve:
          new_score = judge.score(plan, history, knobs_covered)
          if new_score > prev_score:
              # judge가 모순됨. 추가 judge 소집.
              alt_score = alt_judge.score(plan, history, knobs_covered)
              if alt_score < prev_score:  # 적대 judge는 좁힘 확인
                  new_score = max(new_score, alt_score)  # 보수적 채택
              else:
                  # 둘 다 넓힘 → 진짜 모순. 사용자에게 에스컬레이션.
                  emit_contradiction_to_user(prev_score, new_score, alt_score)
          if new_score == prev_score:
              consecutive_same += 1
              if consecutive_same >= 2: BREAK
          prev_score = new_score
      ```

      **dedup_metric: identical-ambiguity-cycle=2**. plan skill의 패턴
      그대로 차용 (`skills/plan/SKILL.md` §2.3).

  - title: 결정 로그 + 루프 로그
    body: |
      ### `.dev-kit/decision-log.md` (per-round append)
      ```markdown
      # interview start (session=abc, ts=2026-07-21T18:00:00Z)
      ## round 1 — score=10, variance=N/A
        reasoning: "초기 상태. 모든 knob 미커버."
        knobs_covered: {}
      ## round 2 — score=7, variance=0.3
        reasoning: "user knob 좁힘. 첫 사용자 = 개발자, 통화 = 시간 절약"
        knobs_covered: {user}
      ## round 3 — score=4, variance=0.5
        ...
      # interview end: status=converged, final_score=2
      ```

      ### `.dev-kit/loop-log.json` (per-cycle append)
      ```json
      {
        "session": "abc",
        "rounds": [
          {"round": 1, "score": 10, "knobs_covered": []},
          {"round": 2, "score": 7, "knobs_covered": ["user"]},
          {"round": 3, "score": 4, "knobs_covered": ["user", "pain"]}
        ],
        "final_status": "converged",
        "final_score": 2
      }
      ```

      → LCS `lcs://interview/<session>` 리소스에 영속화.

  - title: 실패 모드
    body: |
      | 실패 | 처리 |
      |------|------|
      | **LLM judge 비결정성** | 좁힘 강제 + 적대 judge + 에스컬레이션 (§narrowed_delta) |
      | **사용자 거부** | 즉시 종료; "다음 라운드에서 다시 시도" 옵션 제시 |
      | **답변 간 모순** | 합성 검증 라운드 자동 삽입; 모순 명시화 |
      | **사용자 피드백 "질문이 너무 많다"** | 향후 라운드 수 축소; 현재 라운드 종료 후 멈춤 |
      | **safety_valve 도달 (8라운드)** | `best-effort` 종료; 플랜 가치 평가가 `hold` 위임 |
      | **judge variance > 임계값** | 추가 judge 소집; 임계값 초과 시 `contradiction` 플래그 |

  - title: LCS 통합
    body: |
      ### 영속화 (v1)
      - 답변은 `hand-off/<step>.md` 파일에 저장 (기존 방식)
      - 결정 로그 + 루프 로그는 `.dev-kit/decision-log.md` +
        `.dev-kit/loop-log.json` (plan skill의 기존 패턴)
      - LCS는 `lcs://interview/<session>`을 **읽기 뷰**로 노출
      - 새 에이전트가 LCS를 통해 답변 + 점수 추이를 읽음

      ### 영속화 (v2)
      - LCS의 MCP `tools` 채널을 통해 직접 쓰기
      - `hand-off/<step>.md` 폐기; LCS가 단일 진실

      결정: v1은 읽기 뷰, v2에서 쓰기. 이유: v1 LCS는 도구 0개 약속 —
      v2에서 도구 채널 활성화.

  - title: 흡수 위험 (L7)
    body: |
      | 컴포넌트 | 위험 | 비고 |
      |----------|------|------|
      | **질문 생성** (LLM) | **높음** — 모델 흡수 가능 | **얇게**: 5가지 유형 템플릿 + knob 강제; 실제 문장은 모델 생성 |
      | **모호함 점수 계산** (LLM judge) | **높음** — 모델 흡수 가능 | **얇게 + 검증**: 적대 judge + variance gate + narrowed_delta 강제 |
      | 합성 검증 (LLM) | **높음** — 모델 흡수 가능 | 적대 judge 강제 |
      | 상태 전이 (라운드 카운터, knobs_covered 추적) | 낮음 | 포맷 고정 |
      | 종료 로직 (임계값, safety_valve, status 결정) | 매우 낮음 | 결정적 규칙 |
      | 영속화 (v1: 파일 / v2: LCS 도구) | 매우 낮음 | I/O |
      | dedup_metric (identical-ambiguity-cycle=2) | 매우 낮음 | 결정적 |
      | variance gate (N judge 분산 임계값) | 매우 낮음 | 결정적 |

      **결정적 부분 (alpha 집중)**: 종료 로직, dedup_metric, variance gate,
      영속화, 상태 전이. **모델 위임 부분 (얇게 + 게이트)**: 질문 생성,
      점수 계산, 합성 검증. **결정 2 (자가 평가 기각) 적용**: 단일 judge의
      점수가 아닌 다중 judge + variance gate 통과가 점수로 인정됨.

