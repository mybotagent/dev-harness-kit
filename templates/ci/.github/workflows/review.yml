name: PR Review

# Orchestrator: triggers on PR + workflow_dispatch, calls the two wrapper
# workflows (claude-review.yml, claude-security.yml) via workflow_call,
# aggregates their verdicts in the gate job.
#
# The anthropics/claude-code-action@v1 invocation lives in the wrapper
# files (NOT in this one) so the action's "workflow file must be
# identical to main" validation gate always passes — PRs that change
# review.yml don't change claude-{review,security}.yml, so the action
# validates against a stable file.
#
# Severity gate + auto-approve (per claude-review-plugins spec):
#   Approve            (no critical, no major in BOTH review + security) → success + auto-approve
#   Changes Requested  (any major in either)                              → failure
#   Blocked            (any critical in either)                           → failure
#
# Empty-verdict gate (0.1.4+): missing verdict defaults to Approve with
# ::warning:: in BOTH pull_request_target and workflow_dispatch modes.
# The human gate (REVIEW_REQUIRED / CHANGES_REQUESTED) is what blocks merge.
#
# Why pull_request_target: exposes base-branch secrets to the wrapper
# jobs so the claude action can call MINIMAX / Anthropic. Fork-safety
# guards below skip fork PRs BEFORE any step executes.
#
# Bootstrap trade-off (0.1.4 wrapper): the wrapper files themselves
# (claude-review.yml, claude-security.yml) are NOT modified by any PR
# that just changes this orchestrator, so validation passes even on
# the very first PR that adds/modifies review.yml. The wrapper files
# only change when dev-harness-kit ships a new claude-action version.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      review_provider:
        description: "Provider for this run (default: minimax)"
        required: false
        default: "minimax"
        type: choice
        options:
          - minimax
          - anthropic
      pr_number:
        description: "PR number to review"
        required: false
        type: string

# Cancel superseded re-runs on the same PR (e.g. force-push mid-review).
# workflow_dispatch runs are independent and use a separate group.
concurrency:
  group: review-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  review:
    # Fork-safety guard: skip silently for fork PRs (pull_request_target
    # exposes base-branch secrets). workflow_dispatch exempt (operator trusted).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: /dev-kit:review (3-dim)
    uses: ./.github/workflows/claude-review.yml
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      provider: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.review_provider || 'minimax' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit

  security:
    # See review-job comment above; same fork-safety contract.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: /dev-kit:security (10-dim OWASP)
    uses: ./.github/workflows/claude-security.yml
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      provider: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.review_provider || 'minimax' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit

  gate:
    name: severity gate (review + security)
    needs: [review, security]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Combined verdict gate
        env:
          R: ${{ needs.review.outputs.verdict }}
          S: ${{ needs.security.outputs.verdict }}
        run: |
          set -uo pipefail
          EVENT="$EVENT_NAME"
          echo "review=$R  security=$S"

          # Default missing verdicts (in either event mode) to Approve,
          # matching the workflow_dispatch tolerance contract: the human
          # gate (REVIEW_REQUIRED / CHANGES_REQUESTED) is what actually
          # blocks merge, not a single missing agent verdict.
          # Surface ::warning:: so the missing verdict is still visible
          # in the run summary.
          [ -z "$R" ] && { echo "::warning::review verdict missing (event=$EVENT); defaulting to Approve"; R="Approve"; }
          [ -z "$S" ] && { echo "::warning::security verdict missing (event=$EVENT); defaulting to Approve"; S="Approve"; }

          # worst-of wins
          rank() { case "$1" in Blocked) echo 2 ;; "Changes"*) echo 1 ;; Approve) echo 0 ;; *) echo 99 ;; esac; }
          r=$(rank "$R"); s=$(rank "$S")
          worst=$([ "$r" -ge "$s" ] && echo "$R" || echo "$S")
          echo "Combined worst verdict: $worst"

          # Tolerate unparseable verdicts (e.g. "Requested", "Skipped", or
          # unexpected formats from the /dev-kit:* agents): treat as non-
          # blocking — the human gate is what blocks merge.
          if ! { [ "$worst" = "Approve" ] || [ "$worst" = "Changes Requested" ] || [ "$worst" = "Blocked" ]; }; then
            echo "::warning::Unparseable verdict '$worst' (review='$R' security='$S'); treating as non-blocking."
            exit 0
          fi

          case "$worst" in
            Approve) exit 0 ;;
            "Changes"*) echo "::error::Changes Requested (review=$R security=$S)"; exit 1 ;;
            Blocked) echo "::error::Blocked (review=$R security=$S)"; exit 1 ;;
          esac
